---
- name: Validate provider gateway retirement contract
  hosts: assistant
  become: true
  gather_facts: false
  vars_files:
    - "{{ lookup('ansible.builtin.env', 'ROOT_DIR') | default(playbook_dir | dirname | dirname, true) }}/inventories/local/nodes.yml"
    - "{{ playbook_dir }}/roles/ai_client_runtime/defaults/main.yml"
    - "{{ playbook_dir }}/roles/orchestrator_runtime/defaults/main.yml"
    - "{{ playbook_dir }}/roles/orchestrator_egress/defaults/main.yml"
  vars:
    ai_ops_gateway_retirement_apply: false
    ai_ops_gateway_retirement_approval_id: ""
    ai_ops_gateway_retirement_expires_at_utc: ""
    ai_ops_gateway_retirement_scope: ""
    ai_ops_gateway_retirement_allow_stop_disable: false
    ai_ops_gateway_retirement_allow_dewire: false
    ai_ops_gateway_retirement_allow_unit_root_removal: false
    ai_ops_gateway_retirement_acknowledge_absent_preexisting: false
    ai_ops_gateway_retirement_rollback_mode: ""
    ai_ops_gateway_retirement_disposition: verified_absent_preexisting
    ai_ops_gateway_retirement_unit_path: /etc/systemd/system/aiops-provider-gateway.service
    ai_ops_gateway_retirement_ledger_directory: /var/lib/aiops-provider-gateway
    ai_ops_gateway_retirement_remote_approval_path: /run/aiops-orchestrator/remote-approval
    ai_ops_gateway_retirement_bridge_socket_path: /run/openstack-ai-ops/assistant-mcp-bridge.sock
    ai_ops_gateway_retirement_remote_egress_marker: AI-OPS orchestrator remote egress exception
  tasks:
    - name: Assert bounded provider gateway retirement approval
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'assistant01'
          - ai_ops_gateway_retirement_apply | type_debug == 'bool'
          - ai_ops_gateway_retirement_apply | bool
          - ai_ops_gateway_retirement_approval_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$')
          - >-
            ai_ops_gateway_retirement_expires_at_utc is match(
            '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - ai_ops_gateway_retirement_scope == 'provider_gateway_retirement'
          - ai_ops_gateway_retirement_allow_stop_disable | type_debug == 'bool'
          - ai_ops_gateway_retirement_allow_dewire | type_debug == 'bool'
          - ai_ops_gateway_retirement_allow_unit_root_removal | type_debug == 'bool'
          - ai_ops_gateway_retirement_acknowledge_absent_preexisting | type_debug == 'bool'
          - ai_ops_gateway_retirement_acknowledge_absent_preexisting | bool
          - ai_ops_gateway_retirement_rollback_mode == 'disabled_stopped_no_listener'
        fail_msg: ERR_GATEWAY_RETIREMENT_APPROVAL
      no_log: true

    - name: Read target UTC epoch for retirement approval
      ansible.builtin.command:
        argv: [/bin/date, -u, +%s]
      register: ai_ops_gateway_retirement_now_epoch
      changed_when: false
      check_mode: false
      no_log: true

    - name: Parse retirement approval expiry
      ansible.builtin.command:
        argv:
          - /bin/date
          - -u
          - "--date={{ ai_ops_gateway_retirement_expires_at_utc }}"
          - +%s
      register: ai_ops_gateway_retirement_expiry_epoch
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Assert retirement approval expiry is bounded and current
      ansible.builtin.assert:
        that:
          - ai_ops_gateway_retirement_expiry_epoch.rc == 0
          - ai_ops_gateway_retirement_expiry_epoch.stdout | trim is match('^[0-9]+$')
          - ai_ops_gateway_retirement_expiry_epoch.stdout | int > ai_ops_gateway_retirement_now_epoch.stdout | int
          - ai_ops_gateway_retirement_expiry_epoch.stdout | int <= ai_ops_gateway_retirement_now_epoch.stdout | int + 600
        fail_msg: ERR_GATEWAY_RETIREMENT_EXPIRY
      no_log: true

    - name: Run read-only provider gateway retirement preflight
      ansible.builtin.include_tasks:
        file: roles/ai_client_runtime/tasks/provider_gateway_retirement_preflight.yml

    - name: Assert approved provider gateway retirement scope
      ansible.builtin.assert:
        that:
          - ai_ops_gateway_retirement_allow_stop_disable | bool
          - ai_ops_gateway_retirement_allow_dewire | bool
          - ai_ops_gateway_retirement_allow_unit_root_removal | bool
        fail_msg: ERR_GATEWAY_RETIREMENT_REMOVAL_APPROVAL
      no_log: true

    - name: Stop and validate provider gateway closure
      ansible.builtin.include_tasks:
        file: roles/ai_client_runtime/tasks/provider_gateway_retirement_stop.yml

    - name: Remove and validate approved provider gateway active artifacts
      ansible.builtin.include_tasks:
        file: roles/ai_client_runtime/tasks/provider_gateway_retirement_remove.yml

    - name: Report validated provider gateway artifact removal
      ansible.builtin.debug:
        msg: retirement_artifact_removal_validated
