---
- name: Operate approved temporary orchestrator authentication egress window
  hosts: assistant
  become: true
  gather_facts: false
  vars_files:
    - "{{ lookup('ansible.builtin.env', 'ROOT_DIR') | default(playbook_dir | dirname | dirname, true) }}/inventories/local/nodes.yml"
    - "{{ playbook_dir }}/roles/ai_client_runtime/defaults/main.yml"
  vars:
    ai_ops_orchestrator_auth_window_apply: false
    ai_ops_orchestrator_auth_window_approval_id: ""
    ai_ops_orchestrator_auth_window_expires_at_utc: ""
    ai_ops_orchestrator_auth_window_pause_seconds: 0
    ai_ops_orchestrator_auth_window_policy: dedicated_identity_dns_and_https
    ai_ops_orchestrator_auth_window_marker: AI-OPS orchestrator authentication egress exception
  tasks:
    - name: Assert approved authentication window inputs
      ansible.builtin.assert:
        that:
          - ai_ops_orchestrator_auth_window_apply | type_debug == 'bool'
          - ai_ops_orchestrator_auth_window_policy == 'dedicated_identity_dns_and_https'
          - ai_ops_orchestrator_auth_window_approval_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$')
          - ai_ops_orchestrator_auth_window_expires_at_utc is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - ai_ops_orchestrator_auth_window_pause_seconds | int > 0
          - ai_ops_orchestrator_auth_window_pause_seconds | int <= 600
        fail_msg: ERR_ORCHESTRATOR_AUTH_EGRESS_APPROVAL
      no_log: true
      when: ai_ops_orchestrator_auth_window_apply | bool

    - name: Read target UTC epoch before authentication window
      ansible.builtin.command:
        argv: [/bin/date, -u, +%s]
      register: ai_ops_orchestrator_auth_window_now_epoch
      changed_when: false
      check_mode: false
      no_log: true
      when: ai_ops_orchestrator_auth_window_apply | bool

    - name: Parse approved authentication expiry
      ansible.builtin.command:
        argv: [/bin/date, -u, "--date={{ ai_ops_orchestrator_auth_window_expires_at_utc }}", +%s]
      register: ai_ops_orchestrator_auth_window_expiry_epoch
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when: ai_ops_orchestrator_auth_window_apply | bool

    - name: Assert authentication window expiry is bounded and current
      ansible.builtin.assert:
        that:
          - ai_ops_orchestrator_auth_window_expiry_epoch.rc == 0
          - ai_ops_orchestrator_auth_window_expiry_epoch.stdout is match('^[0-9]+$')
          - >-
            ai_ops_orchestrator_auth_window_expiry_epoch.stdout | int > ai_ops_orchestrator_auth_window_now_epoch.stdout |
            int + ai_ops_orchestrator_auth_window_pause_seconds | int
          - ai_ops_orchestrator_auth_window_expiry_epoch.stdout | int <= ai_ops_orchestrator_auth_window_now_epoch.stdout | int + 600
        fail_msg: ERR_ORCHESTRATOR_AUTH_EGRESS_EXPIRY
      no_log: true
      when: ai_ops_orchestrator_auth_window_apply | bool

    - name: Materialize and unconditionally remove temporary authentication egress
      when: ai_ops_orchestrator_auth_window_apply | bool
      block:
        - name: Materialize permanent disabled orchestrator policy
          ansible.builtin.include_role:
            name: orchestrator_egress

        - name: Resolve orchestrator numeric UID
          ansible.builtin.command:
            argv: [/usr/bin/id, -u, aiops-orchestrator]
          register: ai_ops_orchestrator_auth_window_uid
          changed_when: false
          no_log: true

        - name: Install temporary IPv4 authentication owner allows
          ansible.builtin.blockinfile:
            path: /etc/ufw/before.rules
            marker: "# {mark} {{ ai_ops_orchestrator_auth_window_marker }}"
            insertbefore: "^# BEGIN AI-OPS orchestrator disabled egress policy$"
            block: |
              -A ufw-before-output -m owner --uid-owner {{ ai_ops_orchestrator_auth_window_uid.stdout }} -p udp --dport 53 -j ACCEPT
              -A ufw-before-output -m owner --uid-owner {{ ai_ops_orchestrator_auth_window_uid.stdout }} -p tcp --dport 53 -j ACCEPT
              -A ufw-before-output -m owner --uid-owner {{ ai_ops_orchestrator_auth_window_uid.stdout }} -p tcp --dport 443 -j ACCEPT
            validate: /usr/sbin/iptables-restore --test %s
          no_log: true

        - name: Install temporary IPv6 authentication owner allows
          ansible.builtin.blockinfile:
            path: /etc/ufw/before6.rules
            marker: "# {mark} {{ ai_ops_orchestrator_auth_window_marker }}"
            insertbefore: "^# BEGIN AI-OPS orchestrator disabled egress policy$"
            block: |
              -A ufw6-before-output -m owner --uid-owner {{ ai_ops_orchestrator_auth_window_uid.stdout }} -p udp --dport 53 -j ACCEPT
              -A ufw6-before-output -m owner --uid-owner {{ ai_ops_orchestrator_auth_window_uid.stdout }} -p tcp --dport 53 -j ACCEPT
              -A ufw6-before-output -m owner --uid-owner {{ ai_ops_orchestrator_auth_window_uid.stdout }} -p tcp --dport 443 -j ACCEPT
            validate: /usr/sbin/ip6tables-restore --test %s
          no_log: true

        - name: Reload UFW after temporary authentication allows
          ansible.builtin.command:
            argv: [/usr/sbin/ufw, reload]
          changed_when: false
          no_log: true

        - name: Wait for bounded operator-owned authentication interval
          ansible.builtin.pause:
            seconds: "{{ ai_ops_orchestrator_auth_window_pause_seconds | int }}"
      always:
        - name: Remove temporary IPv4 authentication owner allows
          ansible.builtin.blockinfile:
            path: /etc/ufw/before.rules
            marker: "# {mark} {{ ai_ops_orchestrator_auth_window_marker }}"
            state: absent
            validate: /usr/sbin/iptables-restore --test %s
          no_log: true

        - name: Remove temporary IPv6 authentication owner allows
          ansible.builtin.blockinfile:
            path: /etc/ufw/before6.rules
            marker: "# {mark} {{ ai_ops_orchestrator_auth_window_marker }}"
            state: absent
            validate: /usr/sbin/ip6tables-restore --test %s
          no_log: true

        - name: Reload UFW after temporary authentication allow removal
          ansible.builtin.command:
            argv: [/usr/sbin/ufw, reload]
          changed_when: false
          no_log: true

        - name: Revalidate permanent disabled orchestrator policy
          ansible.builtin.include_role:
            name: orchestrator_egress

        - name: Revalidate independent assistant egress preflight
          ansible.builtin.include_role:
            name: assistant_egress_validation
            tasks_from: preflight.yml

        - name: Revalidate independent assistant egress policy
          ansible.builtin.include_role:
            name: assistant_egress_validation
            tasks_from: materialization.yml

        - name: Assert temporary authentication markers are absent
          ansible.builtin.command:
            argv: [/usr/bin/grep, -F, "{{ ai_ops_orchestrator_auth_window_marker }}", "{{ item }}"]
          loop:
            - /etc/ufw/before.rules
            - /etc/ufw/before6.rules
          register: ai_ops_orchestrator_auth_window_marker_check
          changed_when: false
          failed_when: false
          no_log: true

        - name: Assert temporary authentication marker removal
          ansible.builtin.assert:
            that: >-
              ai_ops_orchestrator_auth_window_marker_check.results |
              map(attribute='rc') | list == [1, 1]
            fail_msg: ERR_ORCHESTRATOR_AUTH_EGRESS_ROLLBACK
          no_log: true
