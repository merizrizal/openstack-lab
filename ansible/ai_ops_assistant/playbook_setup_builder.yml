---
- name: Setup builder node for offline MCP wheelhouse
  hosts: wheelhouse_builders
  become: true
  vars_files:
    - "{{ root_dir ~ '/inventories/' ~ target_env ~ '/nodes.yml' }}"
  roles:
    - role: common
      vars:
        additional_packages:
          - python3-pip
          - python3-venv
          - python3-dev
          - python3-packaging
