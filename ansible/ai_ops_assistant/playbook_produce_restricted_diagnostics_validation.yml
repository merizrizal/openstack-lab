---
- name: Produce normalized restricted-diagnostics acceptance state
  hosts: ai_ops_assistant
  become: true
  gather_facts: false
  vars_files:
    - "{{ root_dir ~ '/inventories/' ~ target_env ~ '/nodes.yml' }}"
  vars:
    ansible_pipelining: true
    ai_ops_assistant_phase06_validation_enabled: false
    ai_ops_assistant_phase06_validation_authorization: unconfirmed
    ai_ops_assistant_phase06_validation_phase05_acceptance_gate: unconfirmed
    ai_ops_assistant_phase06_validation_phase05_acceptance_outcome: unconfirmed
    ai_ops_assistant_phase06_validation_phase05_acceptance_evidence_reference: unconfirmed
    ai_ops_assistant_phase06_validation_evidence_owner: unconfirmed
    ai_ops_assistant_phase06_validation_run_id: ""
    ai_ops_assistant_phase06_validation_source_revision: unconfirmed
    ai_ops_assistant_phase06_validation_output_location_approval: unconfirmed
    ai_ops_assistant_phase06_validation_output_directory: /run/openstack-ai-ops/phase06-validation
    ai_ops_assistant_phase06_validation_output_directory_owner: aiops_assistant
    ai_ops_assistant_phase06_validation_output_directory_group: aiops_assistant
    ai_ops_assistant_phase06_validation_output_directory_mode: "0700"
    ai_ops_assistant_phase06_validation_output_file_mode: "0600"
    ai_ops_assistant_phase06_validation_output_path: >-
      {{ ai_ops_assistant_phase06_validation_output_directory }}/{{
      ai_ops_assistant_phase06_validation_run_id }}.json
    ai_ops_assistant_phase06_validation_tool_outcomes: []
    ai_ops_assistant_phase06_validation_negative_controls: []
    ai_ops_assistant_phase06_validation_scope_outcomes: []
    ai_ops_assistant_phase06_validation_audit_pairs: []
    ai_ops_assistant_phase06_validation_pre_attestation:
      valid: false
      unchanged: false
    ai_ops_assistant_phase06_validation_post_attestation:
      valid: false
      unchanged: false
    ai_ops_assistant_phase06_validation_rollback:
      status: pending
      operator_reader_revoked: false
      observer_revoked: false
      authority_isolated: false
    ai_ops_assistant_phase06_validation_representative_workflow:
      status: blocked
      required_evidence_gaps:
        - representative_workflow_pending
      advisory_only: false
      remediation_executed: false
    ai_ops_assistant_phase06_validation_result:
      schema_version: "1.0"
      producer: phase06_restricted_diagnostics_validation
      operation: seven_tool_acceptance_orchestration
      status: blocked
      limitation_class: authorization_pending
      rollback_status: pending
      unresolved_gates:
        - acceptance_inputs_pending
      run_id: unconfirmed
      source_revision: unconfirmed
      phase05_acceptance_confirmed: false
      phase05_acceptance_outcome: unconfirmed
      phase05_acceptance_evidence_reference: unconfirmed
      tools: []
      negative_controls: []
      scope_outcomes: []
      audit_pairs: []
      pre_attestation:
        valid: false
        unchanged: false
      post_attestation:
        valid: false
        unchanged: false
      unchanged_state_comparison: false
      revocation_rollback:
        status: pending
        operator_reader_revoked: false
        observer_revoked: false
        authority_isolated: false
      representative_workflow:
        status: blocked
        required_evidence_gaps:
          - representative_workflow_pending
        advisory_only: false
        remediation_executed: false
      final_acceptance: false
  pre_tasks:
    - name: Assert fixed acceptance-orchestration scope
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'assistant02'
          - "'ai_ops_assistant' in group_names"
          - ansible_play_hosts_all == ['assistant02']
          - ansible_limit | default('') == 'assistant02'
          - ai_ops_assistant_phase06_validation_enabled is boolean
          - ai_ops_assistant_phase06_validation_output_directory == '/run/openstack-ai-ops/phase06-validation'
          - ai_ops_assistant_phase06_validation_output_directory_owner == 'aiops_assistant'
          - ai_ops_assistant_phase06_validation_output_directory_group == 'aiops_assistant'
          - ai_ops_assistant_phase06_validation_output_directory_mode == '0700'
          - ai_ops_assistant_phase06_validation_output_file_mode == '0600'
        quiet: true
      changed_when: false
      no_log: true

    - name: Assert explicit acceptance authorization inputs
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_authorization == 'administrator-authorized-phase06-validation'
          - ai_ops_assistant_phase06_validation_phase05_acceptance_gate == 'administrator-confirmed-external-evidence'
          - ai_ops_assistant_phase06_validation_phase05_acceptance_outcome in ['accepted', 'blocked', 'failed']
          - ai_ops_assistant_phase06_validation_phase05_acceptance_evidence_reference is match('^' ~ ai_ops_assistant_phase06_validation_run_id ~
            '-[A-Za-z0-9._-]{1,127}$')
          - ai_ops_assistant_phase06_validation_evidence_owner is match('^[A-Za-z0-9][A-Za-z0-9 ._@-]{0,95}$')
          - ai_ops_assistant_phase06_validation_evidence_owner != 'unconfirmed'
          - ai_ops_assistant_phase06_validation_output_location_approval == 'administrator-approved-protected-validation-location'
          - ai_ops_assistant_phase06_validation_run_id is match('^[a-z0-9][a-z0-9-]{0,47}$')
          - ai_ops_assistant_phase06_validation_source_revision is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$')
          - ai_ops_assistant_phase06_validation_source_revision != 'unconfirmed'
        fail_msg: >-
          Acceptance orchestration is fail-closed: explicit authorization,
          outcome ownership, run identity, and source revision are required.
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate the closed seven-tool outcome collection
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_tool_outcomes is sequence
          - ai_ops_assistant_phase06_validation_tool_outcomes is not string
          - ai_ops_assistant_phase06_validation_tool_outcomes | length == 7
          - ai_ops_assistant_phase06_validation_tool_outcomes | map(attribute='name') | list | sort == ['neutron_agent_health', 'project_resource_summary',
            'recent_metadata_errors', 'recent_neutron_errors', 'recent_nova_errors', 'server_basic_info', 'server_network_info']
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate each normalized tool outcome
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['audit_pair_valid', 'bounds_valid', 'exit_code_agreement', 'json_shape_valid', 'name', 'outcome', 'redaction_valid',
            'truncated']
          - item.outcome in ['ok', 'empty', 'unavailable', 'denied', 'failed', 'timeout', 'error']
          - item.audit_pair_valid is boolean
          - item.bounds_valid is boolean
          - item.exit_code_agreement is boolean
          - item.json_shape_valid is boolean
          - item.redaction_valid is boolean
          - item.truncated is boolean
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_phase06_validation_tool_outcomes }}"
      loop_control:
        label: normalized-tool
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate the closed negative-control collection
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_negative_controls is sequence
          - ai_ops_assistant_phase06_validation_negative_controls is not string
          - ai_ops_assistant_phase06_validation_negative_controls | length == 18
          - ai_ops_assistant_phase06_validation_negative_controls | map(attribute='case') | list | sort == ['agent_forwarding', 'alternate_sudo_arguments',
            'arbitrary_command', 'collector_output_redirection', 'destination_bypass', 'editor_execution', 'environment_injection', 'extra_arguments',
            'interactive_shell', 'local_forwarding', 'out_of_policy_file_read', 'package_manager_execution', 'pty_allocation', 'remote_forwarding',
            'service_control', 'tunnel_request', 'unrestricted_sudo', 'x11_forwarding']
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate each normalized negative-control outcome
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['case', 'outcome']
          - item.outcome in ['denied', 'unexpected_success', 'unavailable', 'failed']
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_phase06_validation_negative_controls }}"
      loop_control:
        label: normalized-negative-control
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate the ordered scope outcomes
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_scope_outcomes is sequence
          - ai_ops_assistant_phase06_validation_scope_outcomes is not string
          - ai_ops_assistant_phase06_validation_scope_outcomes | length == 11
          - ai_ops_assistant_phase06_validation_scope_outcomes | map(attribute='scope') | list == ['prerequisite_readiness', 'operator_reader_deployment',
            'observer_deployment', 'host_source_contact', 'positive_validation', 'negative_boundary_validation', 'outcome_evidence_recording',
            'protected_audit_inspection', 'unchanged_state_comparison', 'revocation_rollback', 'representative_workflow']
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate each ordered scope outcome
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['evidence_reference', 'scope', 'status']
          - item.status in ['accepted', 'blocked', 'failed', 'unavailable']
          - item.evidence_reference is match('^' ~ ai_ops_assistant_phase06_validation_run_id ~ '-[A-Za-z0-9._-]{1,127}$')
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_phase06_validation_scope_outcomes }}"
      loop_control:
        label: normalized-scope
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate audit-pair, attestation, rollback, and workflow outcomes
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_audit_pairs | length == 7
          - ai_ops_assistant_phase06_validation_audit_pairs | map(attribute='tool') | list | sort == ['neutron_agent_health', 'project_resource_summary',
            'recent_metadata_errors', 'recent_neutron_errors', 'recent_nova_errors', 'server_basic_info', 'server_network_info']
          - item.keys() | list | sort == ['audit_present', 'correlation_valid', 'result_present', 'sanitized', 'tool']
          - item.audit_present is boolean
          - item.correlation_valid is boolean
          - item.result_present is boolean
          - item.sanitized is boolean
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_phase06_validation_audit_pairs }}"
      loop_control:
        label: normalized-audit-pair
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Validate normalized attestation and rollback fields
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_pre_attestation.keys() | list | sort == ['unchanged', 'valid']
          - ai_ops_assistant_phase06_validation_post_attestation.keys() | list | sort == ['unchanged', 'valid']
          - ai_ops_assistant_phase06_validation_pre_attestation.valid is boolean
          - ai_ops_assistant_phase06_validation_pre_attestation.unchanged is boolean
          - ai_ops_assistant_phase06_validation_post_attestation.valid is boolean
          - ai_ops_assistant_phase06_validation_post_attestation.unchanged is boolean
          - ai_ops_assistant_phase06_validation_rollback.keys() | list | sort == ['authority_isolated', 'observer_revoked', 'operator_reader_revoked', 'status']
          - ai_ops_assistant_phase06_validation_rollback.status in ['not_required', 'pending', 'complete', 'failed']
          - ai_ops_assistant_phase06_validation_rollback.operator_reader_revoked is boolean
          - ai_ops_assistant_phase06_validation_rollback.observer_revoked is boolean
          - ai_ops_assistant_phase06_validation_rollback.authority_isolated is boolean
          - ai_ops_assistant_phase06_validation_representative_workflow.keys() | list | sort == ['advisory_only', 'remediation_executed',
            'required_evidence_gaps', 'status']
          - ai_ops_assistant_phase06_validation_representative_workflow.status in ['accepted', 'blocked', 'failed', 'unavailable']
          - ai_ops_assistant_phase06_validation_representative_workflow.required_evidence_gaps | type_debug == 'list'
          - ai_ops_assistant_phase06_validation_representative_workflow.advisory_only is boolean
          - ai_ops_assistant_phase06_validation_representative_workflow.remediation_executed is boolean
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Publish disabled acceptance result without claiming completion
      ansible.builtin.set_fact:
        ai_ops_assistant_phase06_validation_result: >-
          {{ ai_ops_assistant_phase06_validation_result | combine({'run_id': (ai_ops_assistant_phase06_validation_run_id if ai_ops_assistant_phase06_validation_run_id
          | length > 0 else 'unconfirmed'), 'source_revision': ai_ops_assistant_phase06_validation_source_revision}) }}
      changed_when: false
      no_log: true
      when: not (ai_ops_assistant_phase06_validation_enabled | bool)

    - name: Derive normalized acceptance booleans
      ansible.builtin.set_fact:
        ai_ops_assistant_phase06_tools_acceptable: >-
          {{ ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('outcome', 'in', ['ok', 'empty']) | list | length == 7 and
          ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('json_shape_valid', 'equalto', true) | list | length == 7 and
          ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('bounds_valid', 'equalto', true) | list | length == 7 and
          ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('redaction_valid', 'equalto', true) | list | length == 7 and
          ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('exit_code_agreement', 'equalto', true) | list | length == 7 }}
        ai_ops_assistant_phase06_negative_controls_acceptable: >-
          {{ ai_ops_assistant_phase06_validation_negative_controls | selectattr('outcome', 'equalto', 'denied') | list | length == 18 }}
        ai_ops_assistant_phase06_audit_pairs_acceptable: >-
          {{ ai_ops_assistant_phase06_validation_audit_pairs | selectattr('result_present', 'equalto', true) | list | length == 7 and
          ai_ops_assistant_phase06_validation_audit_pairs | selectattr('audit_present', 'equalto', true) | list | length == 7 and
          ai_ops_assistant_phase06_validation_audit_pairs | selectattr('correlation_valid', 'equalto', true) | list | length == 7 and
          ai_ops_assistant_phase06_validation_audit_pairs | selectattr('sanitized', 'equalto', true) | list | length == 7 }}
        ai_ops_assistant_phase06_scopes_acceptable: >-
          {{ ai_ops_assistant_phase06_validation_scope_outcomes | selectattr('status', 'equalto', 'accepted') | list | length == 11 }}
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Derive final acceptance from the closed outcome set
      ansible.builtin.set_fact:
        ai_ops_assistant_phase06_acceptance_eligible: >-
          {{ ai_ops_assistant_phase06_validation_phase05_acceptance_outcome == 'accepted' and
          ai_ops_assistant_phase06_tools_acceptable | bool and
          ai_ops_assistant_phase06_negative_controls_acceptable | bool and
          ai_ops_assistant_phase06_audit_pairs_acceptable | bool and
          ai_ops_assistant_phase06_scopes_acceptable | bool and
          ai_ops_assistant_phase06_validation_pre_attestation.valid | bool and
          ai_ops_assistant_phase06_validation_post_attestation.valid | bool and
          ai_ops_assistant_phase06_validation_post_attestation.unchanged | bool and
          ai_ops_assistant_phase06_validation_rollback.status in ['not_required', 'complete'] and
          ai_ops_assistant_phase06_validation_representative_workflow.status == 'accepted' and
          (ai_ops_assistant_phase06_validation_representative_workflow.required_evidence_gaps | length == 0) and
          ai_ops_assistant_phase06_validation_representative_workflow.advisory_only | bool and
          not (ai_ops_assistant_phase06_validation_representative_workflow.remediation_executed | bool) }}
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Publish the complete normalized acceptance result
      ansible.builtin.set_fact:
        ai_ops_assistant_phase06_validation_result:
          schema_version: "1.0"
          producer: phase06_restricted_diagnostics_validation
          operation: seven_tool_acceptance_orchestration
          status: "{{ 'accepted' if ai_ops_assistant_phase06_acceptance_eligible | bool else ('failed' if (ai_ops_assistant_phase06_validation_scope_outcomes | selectattr('status',
            'equalto', 'failed') | list | length > 0 or ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('outcome', 'equalto', 'failed') | list | length
            > 0 or ai_ops_assistant_phase06_validation_negative_controls | selectattr('outcome', 'in', ['unexpected_success', 'failed']) | list | length > 0) else
            'blocked') }}"
          limitation_class: "{{ 'none' if ai_ops_assistant_phase06_acceptance_eligible | bool else ('validation_failure' if (ai_ops_assistant_phase06_validation_scope_outcomes
            | selectattr('status', 'equalto', 'failed') | list | length > 0 or ai_ops_assistant_phase06_validation_tool_outcomes | selectattr('outcome', 'equalto',
            'failed') | list | length > 0 or ai_ops_assistant_phase06_validation_negative_controls | selectattr('outcome', 'in', ['unexpected_success', 'failed'])
            | list | length > 0) else 'acceptance_pending') }}"
          rollback_status: "{{ ai_ops_assistant_phase06_validation_rollback.status }}"
          unresolved_gates: >-
            {{ ([] if ai_ops_assistant_phase06_acceptance_eligible | bool else
            (['phase05_acceptance_pending'] if ai_ops_assistant_phase06_validation_phase05_acceptance_outcome != 'accepted' else []) +
            (['seven_tool_outcomes_pending'] if not (ai_ops_assistant_phase06_tools_acceptable | bool) else []) +
            (['negative_controls_pending'] if not (ai_ops_assistant_phase06_negative_controls_acceptable | bool) else []) +
            (['audit_pairs_pending'] if not (ai_ops_assistant_phase06_audit_pairs_acceptable | bool) else []) +
            (['scope_outcomes_pending'] if not (ai_ops_assistant_phase06_scopes_acceptable | bool) else []) +
            (['pre_attestation_pending'] if not (ai_ops_assistant_phase06_validation_pre_attestation.valid | bool) else []) +
            (['post_attestation_pending'] if not (ai_ops_assistant_phase06_validation_post_attestation.valid | bool) or not (ai_ops_assistant_phase06_validation_post_attestation.unchanged
            | bool) else []) +
            (['rollback_pending'] if ai_ops_assistant_phase06_validation_rollback.status not in ['not_required', 'complete'] else []) +
            (['representative_workflow_pending'] if ai_ops_assistant_phase06_validation_representative_workflow.status != 'accepted' or ai_ops_assistant_phase06_validation_representative_workflow.required_evidence_gaps
            | length > 0 else [])) }}
          run_id: "{{ ai_ops_assistant_phase06_validation_run_id }}"
          source_revision: "{{ ai_ops_assistant_phase06_validation_source_revision }}"
          phase05_acceptance_confirmed: "{{ ai_ops_assistant_phase06_validation_phase05_acceptance_outcome == 'accepted' }}"
          phase05_acceptance_outcome: "{{ ai_ops_assistant_phase06_validation_phase05_acceptance_outcome }}"
          phase05_acceptance_evidence_reference: "{{ ai_ops_assistant_phase06_validation_phase05_acceptance_evidence_reference }}"
          tools: "{{ ai_ops_assistant_phase06_validation_tool_outcomes }}"
          negative_controls: "{{ ai_ops_assistant_phase06_validation_negative_controls }}"
          scope_outcomes: "{{ ai_ops_assistant_phase06_validation_scope_outcomes }}"
          audit_pairs: "{{ ai_ops_assistant_phase06_validation_audit_pairs }}"
          pre_attestation: "{{ ai_ops_assistant_phase06_validation_pre_attestation }}"
          post_attestation: "{{ ai_ops_assistant_phase06_validation_post_attestation }}"
          unchanged_state_comparison: "{{ ai_ops_assistant_phase06_validation_post_attestation.valid and ai_ops_assistant_phase06_validation_post_attestation.unchanged
            }}"
          revocation_rollback: "{{ ai_ops_assistant_phase06_validation_rollback }}"
          representative_workflow: "{{ ai_ops_assistant_phase06_validation_representative_workflow }}"
          final_acceptance: "{{ ai_ops_assistant_phase06_acceptance_eligible | bool }}"
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Inspect protected validation output directory
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_phase06_validation_output_directory }}"
        follow: false
      register: ai_ops_assistant_phase06_validation_output_directory_stat
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Assert protected validation output directory
      ansible.builtin.assert:
        that:
          - >-
            not ai_ops_assistant_phase06_validation_output_directory_stat.stat.exists or
            (
              ai_ops_assistant_phase06_validation_output_directory_stat.stat.isdir and
              not ai_ops_assistant_phase06_validation_output_directory_stat.stat.islnk and
              ai_ops_assistant_phase06_validation_output_directory_stat.stat.pw_name == ai_ops_assistant_phase06_validation_output_directory_owner and
              ai_ops_assistant_phase06_validation_output_directory_stat.stat.gr_name == ai_ops_assistant_phase06_validation_output_directory_group and
              ai_ops_assistant_phase06_validation_output_directory_stat.stat.mode == ai_ops_assistant_phase06_validation_output_directory_mode
            )
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Create protected validation output directory
      ansible.builtin.file:
        path: "{{ ai_ops_assistant_phase06_validation_output_directory }}"
        state: directory
        owner: "{{ ai_ops_assistant_phase06_validation_output_directory_owner }}"
        group: "{{ ai_ops_assistant_phase06_validation_output_directory_group }}"
        mode: "{{ ai_ops_assistant_phase06_validation_output_directory_mode }}"
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Verify protected validation output directory metadata
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_phase06_validation_output_directory }}"
        follow: false
      register: ai_ops_assistant_phase06_validation_output_directory_verified
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Assert verified validation output directory
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_phase06_validation_output_directory_verified.stat.isdir
          - not ai_ops_assistant_phase06_validation_output_directory_verified.stat.islnk
          - ai_ops_assistant_phase06_validation_output_directory_verified.stat.pw_name == ai_ops_assistant_phase06_validation_output_directory_owner
          - ai_ops_assistant_phase06_validation_output_directory_verified.stat.gr_name == ai_ops_assistant_phase06_validation_output_directory_group
          - ai_ops_assistant_phase06_validation_output_directory_verified.stat.mode == ai_ops_assistant_phase06_validation_output_directory_mode
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Inspect unused normalized acceptance result path
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_phase06_validation_output_path }}"
        follow: false
      register: ai_ops_assistant_phase06_validation_output_path_stat
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Assert normalized acceptance result path is unused
      ansible.builtin.assert:
        that:
          - not ai_ops_assistant_phase06_validation_output_path_stat.stat.exists
          - not (ai_ops_assistant_phase06_validation_output_path_stat.stat.islnk | default(false) | bool)
        quiet: true
      changed_when: false
      no_log: true
      when: ai_ops_assistant_phase06_validation_enabled | bool

    - name: Write normalized acceptance result
      ansible.builtin.copy:
        dest: "{{ ai_ops_assistant_phase06_validation_output_path }}"
        owner: "{{ ai_ops_assistant_phase06_validation_output_directory_owner }}"
        group: "{{ ai_ops_assistant_phase06_validation_output_directory_group }}"
        mode: "{{ ai_ops_assistant_phase06_validation_output_file_mode }}"
        force: false
