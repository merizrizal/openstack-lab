---
- name: Deploy revised AI-OPS diagnostic toolbox
  hosts: ai_ops_assistant
  become: true
  gather_facts: false
  vars_files:
    - "{{ root_dir ~ '/inventories/' ~ target_env ~ '/nodes.yml' }}"
  pre_tasks:
    - name: Assert revised diagnostic-toolbox deployment scope
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'assistant02'
          - "'ai_ops_assistant' in group_names"
          - ansible_play_hosts_all == ['assistant02']
          - ansible_limit | default('') == 'assistant02'
        quiet: true
      changed_when: false
  roles:
    - role: ai_ops_assistant_diagnostic_toolbox
      vars:
        ai_ops_assistant_diagnostic_toolbox_enabled: true
