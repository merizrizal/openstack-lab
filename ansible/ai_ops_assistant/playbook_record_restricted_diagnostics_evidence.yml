---
- name: Record restricted-diagnostics outcome-only evidence
  hosts: ai_ops_assistant
  become: true
  gather_facts: false
  vars_files:
    - "{{ root_dir ~ '/inventories/' ~ target_env ~ '/nodes.yml' }}"
  vars:
    ansible_pipelining: true
    ai_ops_assistant_restricted_evidence_recording_enabled: false
    ai_ops_assistant_restricted_evidence_authorization: unconfirmed
    ai_ops_assistant_restricted_evidence_location_approval: unconfirmed
    ai_ops_assistant_restricted_evidence_owner_name: unconfirmed
    ai_ops_assistant_restricted_evidence_file_owner: unconfirmed
    ai_ops_assistant_restricted_evidence_file_group: unconfirmed
    ai_ops_assistant_restricted_evidence_authorization_reference: unconfirmed
    ai_ops_assistant_restricted_evidence_authorization_class: restricted-diagnostics-evidence-recording
    ai_ops_assistant_restricted_evidence_retention_label: unconfirmed
    ai_ops_assistant_restricted_evidence_access_role_label: unconfirmed
    ai_ops_assistant_restricted_evidence_parent_directory: /opt/openstack-ai-ops-assistant/evidence
    ai_ops_assistant_restricted_evidence_directory: /opt/openstack-ai-ops-assistant/evidence/phase06
    ai_ops_assistant_restricted_evidence_run_id: ""
    ai_ops_assistant_restricted_evidence_source_revision: unconfirmed
    ai_ops_assistant_restricted_evidence_timestamp_utc: unconfirmed
    ai_ops_assistant_restricted_evidence_environment_label: local
    ai_ops_assistant_restricted_evidence_host_group_label: ai_ops_assistant
    ai_ops_assistant_restricted_evidence_runtime_label: revised
    ai_ops_assistant_restricted_evidence_validation_result_directory: /run/openstack-ai-ops/phase06-validation
    ai_ops_assistant_restricted_evidence_validation_result_path: >-
      {{ ai_ops_assistant_restricted_evidence_validation_result_directory }}/{{
      ai_ops_assistant_restricted_evidence_run_id }}.json
    ai_ops_assistant_restricted_evidence_path: >-
      {{ ai_ops_assistant_restricted_evidence_directory }}/{{
      ai_ops_assistant_restricted_evidence_run_id }}.md
    ai_ops_assistant_restricted_evidence_allowed_statuses:
      - accepted
      - unavailable
      - blocked
      - failed
    ai_ops_assistant_restricted_evidence_allowed_limitation_classes:
      - none
      - authorization_pending
      - acceptance_pending
      - validation_failure
      - unavailable
      - contradictory_evidence
      - rollback_required
    ai_ops_assistant_restricted_evidence_manual_validation_fields:
      - ai_ops_assistant_restricted_evidence_validation_result
      - ai_ops_assistant_restricted_evidence_validation_result_raw
      - ai_ops_assistant_restricted_evidence_status
      - ai_ops_assistant_restricted_evidence_tools
      - ai_ops_assistant_restricted_evidence_negative_controls
      - ai_ops_assistant_restricted_evidence_scope_outcomes
      - ai_ops_assistant_restricted_evidence_audit_pairs
      - ai_ops_assistant_restricted_evidence_final_acceptance
  pre_tasks:
    - name: Assert restricted evidence recording scope
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'assistant02'
          - "'ai_ops_assistant' in group_names"
          - ansible_play_hosts_all == ['assistant02']
          - ansible_limit | default('') == 'assistant02'
        quiet: true
      changed_when: false
      no_log: true

    - name: Assert protected evidence authorization and safe record inputs
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_recording_enabled | bool
          - ai_ops_assistant_restricted_evidence_authorization == 'administrator-authorized-outcome-only-recording'
          - ai_ops_assistant_restricted_evidence_location_approval == 'administrator-approved-protected-location'
          - ai_ops_assistant_restricted_evidence_owner_name is match('^[A-Za-z0-9][A-Za-z0-9 ._@-]{0,95}$')
          - ai_ops_assistant_restricted_evidence_owner_name != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_file_owner is match('^[a-z_][a-z0-9_-]{0,31}$')
          - ai_ops_assistant_restricted_evidence_file_owner != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_file_group is match('^[a-z_][a-z0-9_-]{0,31}$')
          - ai_ops_assistant_restricted_evidence_file_group != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_authorization_reference is match('^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,95}$')
          - ai_ops_assistant_restricted_evidence_authorization_reference != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_authorization_class == 'restricted-diagnostics-evidence-recording'
          - ai_ops_assistant_restricted_evidence_environment_label is match('^[a-z0-9][a-z0-9._-]{0,63}$')
          - ai_ops_assistant_restricted_evidence_host_group_label == 'ai_ops_assistant'
          - ai_ops_assistant_restricted_evidence_runtime_label == 'revised'
          - ai_ops_assistant_restricted_evidence_validation_result_directory == '/run/openstack-ai-ops/phase06-validation'
          - ai_ops_assistant_restricted_evidence_retention_label is match('^[a-z0-9][a-z0-9._-]{0,63}$')
          - ai_ops_assistant_restricted_evidence_retention_label != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_access_role_label is match('^[a-z0-9][a-z0-9._-]{0,63}$')
          - ai_ops_assistant_restricted_evidence_access_role_label != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_parent_directory == '/opt/openstack-ai-ops-assistant/evidence'
          - ai_ops_assistant_restricted_evidence_directory == '/opt/openstack-ai-ops-assistant/evidence/phase06'
          - ai_ops_assistant_restricted_evidence_run_id is match('^[a-z0-9][a-z0-9-]{0,47}$')
          - ai_ops_assistant_restricted_evidence_source_revision is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$')
          - ai_ops_assistant_restricted_evidence_source_revision != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_timestamp_utc is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - ai_ops_assistant_restricted_evidence_validation_result_path is match('^/run/openstack-ai-ops/phase06-validation/[a-z0-9][a-z0-9-]{0,47}\.json$')
          - ai_ops_assistant_restricted_evidence_path is match('^/opt/openstack-ai-ops-assistant/evidence/phase06/[a-z0-9][a-z0-9-]{0,47}\.md$')
        fail_msg: >-
          Outcome-only evidence recording is fail-closed: named ownership,
          authorization, safe paths, and run metadata are required.
        quiet: true
      changed_when: false
      no_log: true

    - name: Reject manual producer-derived fields
      ansible.builtin.assert:
        that:
          - item not in vars
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_restricted_evidence_manual_validation_fields }}"
      loop_control:
        label: producer-derived-field

    - name: Inspect normalized producer result
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_validation_result_path }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_validation_result_stat
      changed_when: false
      no_log: true

    - name: Assert normalized producer result metadata
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.exists
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.isreg
          - not ai_ops_assistant_restricted_evidence_validation_result_stat.stat.islnk
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.pw_name == 'aiops_assistant'
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.gr_name == 'aiops_assistant'
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.mode == '0600'
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.size | int > 0
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.size | int <= 16384
        quiet: true
      changed_when: false
      no_log: true

    - name: Read producer result into protected task state
      ansible.builtin.slurp:
        src: "{{ ai_ops_assistant_restricted_evidence_validation_result_path }}"
      register: ai_ops_assistant_restricted_evidence_validation_result_raw
      changed_when: false
      no_log: true

    - name: Decode producer result in protected task state
      ansible.builtin.set_fact:
        ai_ops_assistant_restricted_evidence_validation_result: >-
          {{ ai_ops_assistant_restricted_evidence_validation_result_raw.content | b64decode | from_json }}
      changed_when: false
      no_log: true

    - name: Validate closed producer result and derive acceptance invariant
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_validation_result.keys() | list | sort == ['audit_pairs', 'final_acceptance', 'limitation_class',
            'negative_controls', 'operation', 'phase05_acceptance_confirmed', 'phase05_acceptance_evidence_reference', 'phase05_acceptance_outcome',
            'post_attestation', 'pre_attestation', 'producer', 'representative_workflow', 'revocation_rollback', 'rollback_status', 'run_id', 'schema_version',
            'scope_outcomes', 'source_revision', 'status', 'tools', 'unchanged_state_comparison', 'unresolved_gates']
          - ai_ops_assistant_restricted_evidence_validation_result.schema_version == '1.0'
          - ai_ops_assistant_restricted_evidence_validation_result.producer == 'phase06_restricted_diagnostics_validation'
          - ai_ops_assistant_restricted_evidence_validation_result.operation == 'seven_tool_acceptance_orchestration'
          - ai_ops_assistant_restricted_evidence_validation_result.run_id == ai_ops_assistant_restricted_evidence_run_id
          - ai_ops_assistant_restricted_evidence_validation_result.source_revision == ai_ops_assistant_restricted_evidence_source_revision
          - ai_ops_assistant_restricted_evidence_validation_result.status in ai_ops_assistant_restricted_evidence_allowed_statuses
          - ai_ops_assistant_restricted_evidence_validation_result.limitation_class in ai_ops_assistant_restricted_evidence_allowed_limitation_classes
          - ai_ops_assistant_restricted_evidence_validation_result.rollback_status in ['not_required', 'pending', 'complete', 'failed']
          - ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_confirmed is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_outcome in ['accepted', 'blocked', 'failed']
          - ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_confirmed ==
            (ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_outcome == 'accepted')
          - ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_evidence_reference is match('^' ~
            ai_ops_assistant_restricted_evidence_run_id ~ '-[A-Za-z0-9._-]{1,127}$')
          - ai_ops_assistant_restricted_evidence_validation_result.tools | length == 7
          - ai_ops_assistant_restricted_evidence_validation_result.tools | map(attribute='name') | list | sort == ['neutron_agent_health',
            'project_resource_summary', 'recent_metadata_errors', 'recent_neutron_errors', 'recent_nova_errors', 'server_basic_info', 'server_network_info']
          - ai_ops_assistant_restricted_evidence_validation_result.negative_controls | length == 18
          - ai_ops_assistant_restricted_evidence_validation_result.negative_controls | map(attribute='case') | list | sort == ['agent_forwarding',
            'alternate_sudo_arguments', 'arbitrary_command', 'collector_output_redirection', 'destination_bypass', 'editor_execution', 'environment_injection',
            'extra_arguments', 'interactive_shell', 'local_forwarding', 'out_of_policy_file_read', 'package_manager_execution', 'pty_allocation',
            'remote_forwarding', 'service_control', 'tunnel_request', 'unrestricted_sudo', 'x11_forwarding']
          - ai_ops_assistant_restricted_evidence_validation_result.scope_outcomes | length == 11
          - ai_ops_assistant_restricted_evidence_validation_result.scope_outcomes | map(attribute='scope') | list == ['prerequisite_readiness',
            'operator_reader_deployment', 'observer_deployment', 'host_source_contact', 'positive_validation', 'negative_boundary_validation',
            'outcome_evidence_recording', 'protected_audit_inspection', 'unchanged_state_comparison', 'revocation_rollback', 'representative_workflow']
          - ai_ops_assistant_restricted_evidence_validation_result.audit_pairs | length == 7
          - ai_ops_assistant_restricted_evidence_validation_result.pre_attestation.valid is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.post_attestation.valid is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.post_attestation.unchanged is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.unchanged_state_comparison is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.revocation_rollback.status in ['not_required', 'pending', 'complete', 'failed']
          - ai_ops_assistant_restricted_evidence_validation_result.representative_workflow.status in ['accepted', 'blocked', 'failed', 'unavailable']
          - ai_ops_assistant_restricted_evidence_validation_result.representative_workflow.advisory_only is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.representative_workflow.remediation_executed is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.final_acceptance is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.status != 'accepted' or
            ai_ops_assistant_restricted_evidence_validation_result.final_acceptance
        fail_msg: >-
          Evidence recording requires the exact seven-tool, scope, negative,
          audit, attestation, rollback, and workflow result contract.
        quiet: true
      changed_when: false
      no_log: true

    - name: Validate normalized tool, negative, scope, and audit records
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['audit_pair_valid', 'bounds_valid', 'exit_code_agreement', 'json_shape_valid', 'name', 'outcome', 'redaction_valid',
            'truncated']
          - item.outcome in ['ok', 'empty', 'unavailable', 'denied', 'failed', 'timeout', 'error']
          - item.audit_pair_valid is boolean
          - item.bounds_valid is boolean
          - item.exit_code_agreement is boolean
          - item.json_shape_valid is boolean
          - item.redaction_valid is boolean
          - item.truncated is boolean
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_restricted_evidence_validation_result.tools }}"
      loop_control:
        label: normalized-tool

    - name: Validate normalized negative-control records
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['case', 'outcome']
          - item.outcome in ['denied', 'unexpected_success', 'unavailable', 'failed']
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_restricted_evidence_validation_result.negative_controls }}"
      loop_control:
        label: normalized-negative-control

    - name: Validate normalized scope records
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['evidence_reference', 'scope', 'status']
          - item.status in ['accepted', 'blocked', 'failed', 'unavailable']
          - item.evidence_reference is match('^' ~ ai_ops_assistant_restricted_evidence_run_id ~ '-[A-Za-z0-9._-]{1,127}$')
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_restricted_evidence_validation_result.scope_outcomes }}"
      loop_control:
        label: normalized-scope

    - name: Validate normalized audit-pair records
      ansible.builtin.assert:
        that:
          - item.keys() | list | sort == ['audit_present', 'correlation_valid', 'result_present', 'sanitized', 'tool']
          - item.audit_present is boolean
          - item.correlation_valid is boolean
          - item.result_present is boolean
          - item.sanitized is boolean
        quiet: true
      changed_when: false
      no_log: true
      loop: "{{ ai_ops_assistant_restricted_evidence_validation_result.audit_pairs }}"
      loop_control:
        label: normalized-audit-pair

    - name: Inspect protected evidence parent and record path
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_path_stats
      changed_when: false
      no_log: true
      loop:
        - "{{ ai_ops_assistant_restricted_evidence_parent_directory }}"
        - "{{ ai_ops_assistant_restricted_evidence_directory }}"
        - "{{ ai_ops_assistant_restricted_evidence_path }}"
      loop_control:
        label: protected-evidence-path

    - name: Assert protected evidence paths
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_path_stats.results[0].stat.exists
          - ai_ops_assistant_restricted_evidence_path_stats.results[0].stat.isdir
          - not (ai_ops_assistant_restricted_evidence_path_stats.results[0].stat.islnk | default(false) | bool)
          - >-
            not (ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.exists | default(false) | bool) or
            (
              ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.isdir and
              not ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.islnk and
              ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.pw_name == ai_ops_assistant_restricted_evidence_file_owner and
              ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.gr_name == ai_ops_assistant_restricted_evidence_file_group and
              ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.mode == '0700'
            )
          - not (ai_ops_assistant_restricted_evidence_path_stats.results[2].stat.exists | default(false) | bool)
        quiet: true
      changed_when: false
      no_log: true

  tasks:
    - name: Create protected evidence directory
      ansible.builtin.file:
        path: "{{ ai_ops_assistant_restricted_evidence_directory }}"
        state: directory
        owner: "{{ ai_ops_assistant_restricted_evidence_file_owner }}"
        group: "{{ ai_ops_assistant_restricted_evidence_file_group }}"
        mode: "0700"
      no_log: true

    - name: Verify protected evidence directory metadata
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_directory }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_directory_stat
      changed_when: false
      no_log: true

    - name: Assert protected evidence directory metadata
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.isdir
          - not ai_ops_assistant_restricted_evidence_directory_stat.stat.islnk
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.pw_name == ai_ops_assistant_restricted_evidence_file_owner
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.gr_name == ai_ops_assistant_restricted_evidence_file_group
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.mode == '0700'
        quiet: true
      changed_when: false
      no_log: true

    - name: Write normalized outcome-only evidence record
      ansible.builtin.copy:
        dest: "{{ ai_ops_assistant_restricted_evidence_path }}"
        owner: "{{ ai_ops_assistant_restricted_evidence_file_owner }}"
        group: "{{ ai_ops_assistant_restricted_evidence_file_group }}"
        mode: "0600"
        force: false
        content: |
          # Restricted Operator and Host Diagnostics Outcome-Only Evidence

          ## Metadata

          - Source revision: {{ ai_ops_assistant_restricted_evidence_source_revision }}
          - UTC timestamp: {{ ai_ops_assistant_restricted_evidence_timestamp_utc }}
          - Non-secret run ID: {{ ai_ops_assistant_restricted_evidence_run_id }}
          - Environment label: {{ ai_ops_assistant_restricted_evidence_environment_label }}
          - Host-group label: {{ ai_ops_assistant_restricted_evidence_host_group_label }}
          - Runtime label: {{ ai_ops_assistant_restricted_evidence_runtime_label }}
          - Evidence owner: {{ ai_ops_assistant_restricted_evidence_owner_name }}
          - Authorization class: {{ ai_ops_assistant_restricted_evidence_authorization_class }}
          - Authorization reference: {{ ai_ops_assistant_restricted_evidence_authorization_reference }}
          - Retention policy label: {{ ai_ops_assistant_restricted_evidence_retention_label }}
          - Access-role label: {{ ai_ops_assistant_restricted_evidence_access_role_label }}

          ## Normalized outcome

          - Overall status: {{ ai_ops_assistant_restricted_evidence_validation_result.status }}
          - Limitation class: {{ ai_ops_assistant_restricted_evidence_validation_result.limitation_class }}
          - Rollback status: {{ ai_ops_assistant_restricted_evidence_validation_result.rollback_status }}
          - Final acceptance: {{ ai_ops_assistant_restricted_evidence_validation_result.final_acceptance | bool }}
          - Unresolved gate labels: {{ (ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates | join(', ')) if (ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates | length > 0) else 'none' }}

          ## Tool and scope outcomes

          - Tools: {{ ai_ops_assistant_restricted_evidence_validation_result.tools | to_json }}
          - Negative controls: {{ ai_ops_assistant_restricted_evidence_validation_result.negative_controls | to_json }}
          - Scopes: {{ ai_ops_assistant_restricted_evidence_validation_result.scope_outcomes | to_json }}
          - Audit pairs: {{ ai_ops_assistant_restricted_evidence_validation_result.audit_pairs | to_json }}
          - Representative workflow: {{ ai_ops_assistant_restricted_evidence_validation_result.representative_workflow | to_json }}

          ## State and prerequisite outcomes

          - Phase 05 acceptance confirmed: {{ ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_confirmed | bool }}
          - Phase 05 acceptance outcome: {{ ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_outcome }}
          - Phase 05 acceptance evidence reference: {{ ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_evidence_reference }}
          - Pre-attestation valid: {{ ai_ops_assistant_restricted_evidence_validation_result.pre_attestation.valid | bool }}
          - Post-attestation valid: {{ ai_ops_assistant_restricted_evidence_validation_result.post_attestation.valid | bool }}
          - Post-attestation unchanged: {{ ai_ops_assistant_restricted_evidence_validation_result.post_attestation.unchanged | bool }}
          - Unchanged-state comparison: {{ ai_ops_assistant_restricted_evidence_validation_result.unchanged_state_comparison | bool }}
          - Revocation/rollback: {{ ai_ops_assistant_restricted_evidence_validation_result.revocation_rollback | to_json }}
      no_log: true

    - name: Verify protected evidence record metadata
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_path }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_record_stat
      changed_when: false
      no_log: true

    - name: Assert protected evidence record metadata
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_record_stat.stat.isreg
          - not ai_ops_assistant_restricted_evidence_record_stat.stat.islnk
          - ai_ops_assistant_restricted_evidence_record_stat.stat.pw_name == ai_ops_assistant_restricted_evidence_file_owner
          - ai_ops_assistant_restricted_evidence_record_stat.stat.gr_name == ai_ops_assistant_restricted_evidence_file_group
          - ai_ops_assistant_restricted_evidence_record_stat.stat.mode == '0600'
        quiet: true
      changed_when: false
      no_log: true
