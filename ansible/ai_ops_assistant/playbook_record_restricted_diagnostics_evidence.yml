---
- name: Record restricted diagnostics outcome-only evidence
  hosts: ai_ops_assistant
  become: true
  gather_facts: false
  vars_files:
    - "{{ root_dir ~ '/inventories/' ~ target_env ~ '/nodes.yml' }}"
  vars:
    ansible_pipelining: true
    ai_ops_assistant_restricted_evidence_recording_enabled: false
    ai_ops_assistant_restricted_evidence_authorization: unconfirmed
    ai_ops_assistant_restricted_evidence_location_approval: unconfirmed
    ai_ops_assistant_restricted_evidence_owner_name: unconfirmed
    ai_ops_assistant_restricted_evidence_file_owner: unconfirmed
    ai_ops_assistant_restricted_evidence_file_group: unconfirmed
    ai_ops_assistant_restricted_evidence_authorization_reference: unconfirmed
    ai_ops_assistant_restricted_evidence_authorization_class: restricted-diagnostics-evidence-recording
    ai_ops_assistant_restricted_evidence_retention_label: unconfirmed
    ai_ops_assistant_restricted_evidence_access_role_label: unconfirmed
    ai_ops_assistant_restricted_evidence_parent_directory: /opt/openstack-ai-ops-assistant/evidence
    ai_ops_assistant_restricted_evidence_directory: /opt/openstack-ai-ops-assistant/evidence/phase06
    ai_ops_assistant_restricted_evidence_run_id: ""
    ai_ops_assistant_restricted_evidence_source_revision: unconfirmed
    ai_ops_assistant_restricted_evidence_timestamp_utc: unconfirmed
    ai_ops_assistant_restricted_evidence_environment_label: local
    ai_ops_assistant_restricted_evidence_host_group_label: ai_ops_assistant
    ai_ops_assistant_restricted_evidence_runtime_label: revised
    ai_ops_assistant_restricted_evidence_validation_result_directory: /run/openstack-ai-ops/phase06-validation
    ai_ops_assistant_restricted_evidence_validation_result_path: >-
      {{ ai_ops_assistant_restricted_evidence_validation_result_directory }}/{{
      ai_ops_assistant_restricted_evidence_run_id }}.json
    ai_ops_assistant_restricted_evidence_validation_result_allowed_producers:
      - phase06_restricted_diagnostics_validation
    ai_ops_assistant_restricted_evidence_validation_result_allowed_operations:
      - neutron_agent_list_project_reader
    ai_ops_assistant_restricted_evidence_manual_validation_fields:
      - ai_ops_assistant_restricted_evidence_validation_result
      - ai_ops_assistant_restricted_evidence_validation_result_raw
      - ai_ops_assistant_restricted_evidence_status
      - ai_ops_assistant_restricted_evidence_limitation_class
      - ai_ops_assistant_restricted_evidence_rollback_status
      - ai_ops_assistant_restricted_evidence_unresolved_gates
      - ai_ops_assistant_restricted_evidence_phase05_acceptance_confirmed
      - ai_ops_assistant_restricted_evidence_neutron_read_classified
      - ai_ops_assistant_restricted_evidence_operator_reader_reviewed
      - ai_ops_assistant_restricted_evidence_observer_policy_reviewed
      - ai_ops_assistant_restricted_evidence_negative_test_plan_approved
      - ai_ops_assistant_restricted_evidence_output_schema_frozen
      - ai_ops_assistant_restricted_evidence_redaction_check_completed
    ai_ops_assistant_restricted_evidence_path: >-
      {{ ai_ops_assistant_restricted_evidence_directory }}/{{ ai_ops_assistant_restricted_evidence_run_id }}.md
    ai_ops_assistant_restricted_evidence_allowed_statuses:
      - accepted
      - unavailable
      - blocked
      - failed
    ai_ops_assistant_restricted_evidence_allowed_limitation_classes:
      - none
      - authorization_pending
      - policy_denied
      - catalog_missing
      - connectivity_error
      - authentication_error
      - configuration_error
      - unavailable
      - contradictory_evidence
      - rollback_required
    ai_ops_assistant_restricted_evidence_allowed_rollback_statuses:
      - not_required
      - pending
      - complete
      - failed
  pre_tasks:
    - name: Assert restricted evidence recording scope
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'assistant02'
          - "'ai_ops_assistant' in group_names"
          - ansible_play_hosts_all == ['assistant02']
          - ansible_limit | default('') == 'assistant02'
        quiet: true
      changed_when: false
      no_log: true

    - name: Assert protected evidence authorization and safe record inputs
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_recording_enabled | bool
          - ai_ops_assistant_restricted_evidence_authorization == 'administrator-authorized-outcome-only-recording'
          - ai_ops_assistant_restricted_evidence_location_approval == 'administrator-approved-protected-location'
          - ai_ops_assistant_restricted_evidence_owner_name is match('^[A-Za-z0-9][A-Za-z0-9 ._@-]{0,95}$')
          - ai_ops_assistant_restricted_evidence_owner_name != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_file_owner is match('^[a-z_][a-z0-9_-]{0,31}$')
          - ai_ops_assistant_restricted_evidence_file_owner != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_file_group is match('^[a-z_][a-z0-9_-]{0,31}$')
          - ai_ops_assistant_restricted_evidence_file_group != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_authorization_reference is match('^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,95}$')
          - ai_ops_assistant_restricted_evidence_authorization_reference != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_authorization_class == 'restricted-diagnostics-evidence-recording'
          - ai_ops_assistant_restricted_evidence_retention_label is match('^[a-z0-9][a-z0-9._-]{0,63}$')
          - ai_ops_assistant_restricted_evidence_retention_label != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_access_role_label is match('^[a-z0-9][a-z0-9._-]{0,63}$')
          - ai_ops_assistant_restricted_evidence_access_role_label != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_parent_directory == '/opt/openstack-ai-ops-assistant/evidence'
          - ai_ops_assistant_restricted_evidence_directory == '/opt/openstack-ai-ops-assistant/evidence/phase06'
          - ai_ops_assistant_restricted_evidence_run_id is match('^[a-z0-9][a-z0-9-]{0,47}$')
          - ai_ops_assistant_restricted_evidence_source_revision is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$')
          - ai_ops_assistant_restricted_evidence_source_revision != 'unconfirmed'
          - ai_ops_assistant_restricted_evidence_timestamp_utc is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - ai_ops_assistant_restricted_evidence_environment_label is match('^[a-z0-9][a-z0-9._-]{0,63}$')
          - ai_ops_assistant_restricted_evidence_host_group_label == 'ai_ops_assistant'
          - ai_ops_assistant_restricted_evidence_runtime_label == 'revised'
          - ai_ops_assistant_restricted_evidence_validation_result_directory == '/run/openstack-ai-ops/phase06-validation'
          - ai_ops_assistant_restricted_evidence_validation_result_path is match('^/run/openstack-ai-ops/phase06-validation/[a-z0-9][a-z0-9-]{0,47}\.json$')
          - ai_ops_assistant_restricted_evidence_path is match('^/opt/openstack-ai-ops-assistant/evidence/phase06/[a-z0-9][a-z0-9-]{0,47}\.md$')
        fail_msg: >-
          Restricted evidence recording is fail-closed: named ownership, explicit
          authorization, approved location, safe normalized fields, and a safe run
          identifier are required before the record can be written.
        quiet: true
      changed_when: false
      no_log: true

    - name: Reject manual producer-derived validation fields
      ansible.builtin.assert:
        that:
          - item not in vars
        quiet: true
      loop: "{{ ai_ops_assistant_restricted_evidence_manual_validation_fields }}"
      loop_control:
        label: producer-derived-field
      changed_when: false
      no_log: true

    - name: Inspect normalized producer result without following symlinks
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_validation_result_path }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_validation_result_stat
      changed_when: false
      no_log: true

    - name: Assert normalized producer result metadata
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.exists
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.isreg
          - not ai_ops_assistant_restricted_evidence_validation_result_stat.stat.islnk
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.pw_name == 'aiops_assistant'
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.gr_name == 'aiops_assistant'
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.mode == '0600'
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.size | int > 0
          - ai_ops_assistant_restricted_evidence_validation_result_stat.stat.size | int <= 16384
        quiet: true
      changed_when: false
      no_log: true

    - name: Read normalized producer result into protected task state
      ansible.builtin.slurp:
        src: "{{ ai_ops_assistant_restricted_evidence_validation_result_path }}"
      register: ai_ops_assistant_restricted_evidence_validation_result_raw
      changed_when: false
      no_log: true

    - name: Decode normalized producer result in protected task state
      ansible.builtin.set_fact:
        ai_ops_assistant_restricted_evidence_validation_result: >-
          {{ ai_ops_assistant_restricted_evidence_validation_result_raw.content |
          b64decode | from_json }}
      changed_when: false
      no_log: true

    - name: Validate normalized producer result schema and provenance
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_validation_result is mapping
          - >-
            ai_ops_assistant_restricted_evidence_validation_result.keys() | list | sort ==
            ['neutron_read_classified', 'neutron_read_json_shape_valid',
            'neutron_read_outcome', 'neutron_read_read_only_operation',
            'negative_test_plan_approved', 'observer_policy_reviewed',
            'operator_reader_reviewed', 'output_schema_frozen',
            'phase05_acceptance_confirmed', 'producer', 'redaction_check_completed',
            'rollback_status', 'run_id', 'schema_version', 'source_revision',
            'status', 'limitation_class', 'unresolved_gates',
            'operation'] | sort
          - ai_ops_assistant_restricted_evidence_validation_result.schema_version == '1.0'
          - ai_ops_assistant_restricted_evidence_validation_result.producer in ai_ops_assistant_restricted_evidence_validation_result_allowed_producers
          - ai_ops_assistant_restricted_evidence_validation_result.operation in ai_ops_assistant_restricted_evidence_validation_result_allowed_operations
          - ai_ops_assistant_restricted_evidence_validation_result.run_id == ai_ops_assistant_restricted_evidence_run_id
          - ai_ops_assistant_restricted_evidence_validation_result.source_revision == ai_ops_assistant_restricted_evidence_source_revision
          - ai_ops_assistant_restricted_evidence_validation_result.status in ai_ops_assistant_restricted_evidence_allowed_statuses
          - ai_ops_assistant_restricted_evidence_validation_result.limitation_class in ai_ops_assistant_restricted_evidence_allowed_limitation_classes
          - ai_ops_assistant_restricted_evidence_validation_result.rollback_status in ai_ops_assistant_restricted_evidence_allowed_rollback_statuses
          - ai_ops_assistant_restricted_evidence_validation_result.neutron_read_outcome in ['pass', 'empty', 'policy_denied', 'catalog_missing',
            'connectivity_error', 'authentication_error', 'configuration_error']
          - ai_ops_assistant_restricted_evidence_validation_result.neutron_read_json_shape_valid is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.neutron_read_read_only_operation is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.neutron_read_classified is boolean
          - >-
            ai_ops_assistant_restricted_evidence_validation_result.neutron_read_classified ==
            (ai_ops_assistant_restricted_evidence_validation_result.neutron_read_outcome in
            ['pass', 'empty', 'policy_denied'])
          - ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_confirmed is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.operator_reader_reviewed is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.observer_policy_reviewed is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.negative_test_plan_approved is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.output_schema_frozen is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.redaction_check_completed is boolean
          - ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates | type_debug == 'list'
          - >-
            (ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates |
            select('match', '^[a-z0-9][a-z0-9._-]{0,63}$') | list | length) ==
            (ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates | length)
          - >-
            ai_ops_assistant_restricted_evidence_validation_result.status != 'accepted' or
            (
              ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates | length == 0 and
              ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_confirmed and
              ai_ops_assistant_restricted_evidence_validation_result.neutron_read_classified and
              ai_ops_assistant_restricted_evidence_validation_result.neutron_read_json_shape_valid and
              ai_ops_assistant_restricted_evidence_validation_result.neutron_read_read_only_operation and
              ai_ops_assistant_restricted_evidence_validation_result.limitation_class == 'none' and
              ai_ops_assistant_restricted_evidence_validation_result.rollback_status == 'not_required' and
              ai_ops_assistant_restricted_evidence_validation_result.operator_reader_reviewed and
              ai_ops_assistant_restricted_evidence_validation_result.observer_policy_reviewed and
              ai_ops_assistant_restricted_evidence_validation_result.negative_test_plan_approved and
              ai_ops_assistant_restricted_evidence_validation_result.output_schema_frozen and
              ai_ops_assistant_restricted_evidence_validation_result.redaction_check_completed
            )
        fail_msg: >-
          Evidence recording requires a protected producer result with exact schema,
          run/source provenance, and normalized gate values; manual validation fields
          are not accepted.
        quiet: true
      changed_when: false
      no_log: true

    - name: Map normalized producer result to recorder fields
      ansible.builtin.set_fact:
        ai_ops_assistant_restricted_evidence_status: "{{ ai_ops_assistant_restricted_evidence_validation_result.status }}"
        ai_ops_assistant_restricted_evidence_limitation_class: "{{ ai_ops_assistant_restricted_evidence_validation_result.limitation_class }}"
        ai_ops_assistant_restricted_evidence_rollback_status: "{{ ai_ops_assistant_restricted_evidence_validation_result.rollback_status }}"
        ai_ops_assistant_restricted_evidence_unresolved_gates: "{{ ai_ops_assistant_restricted_evidence_validation_result.unresolved_gates }}"
        ai_ops_assistant_restricted_evidence_phase05_acceptance_confirmed: "{{ ai_ops_assistant_restricted_evidence_validation_result.phase05_acceptance_confirmed
          | bool }}"
        ai_ops_assistant_restricted_evidence_neutron_read_classified: "{{ ai_ops_assistant_restricted_evidence_validation_result.neutron_read_classified | bool }}"
        ai_ops_assistant_restricted_evidence_operator_reader_reviewed: "{{ ai_ops_assistant_restricted_evidence_validation_result.operator_reader_reviewed | bool
          }}"
        ai_ops_assistant_restricted_evidence_observer_policy_reviewed: "{{ ai_ops_assistant_restricted_evidence_validation_result.observer_policy_reviewed | bool
          }}"
        ai_ops_assistant_restricted_evidence_negative_test_plan_approved: "{{ ai_ops_assistant_restricted_evidence_validation_result.negative_test_plan_approved |
          bool }}"
        ai_ops_assistant_restricted_evidence_output_schema_frozen: "{{ ai_ops_assistant_restricted_evidence_validation_result.output_schema_frozen | bool }}"
        ai_ops_assistant_restricted_evidence_redaction_check_completed: "{{ ai_ops_assistant_restricted_evidence_validation_result.redaction_check_completed | bool
          }}"
      changed_when: false
      no_log: true

    - name: Inspect approved evidence parent without following symlinks
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_parent_directory }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_parent_stat
      changed_when: false
      no_log: true

    - name: Inspect evidence directory and record without following symlinks
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ ai_ops_assistant_restricted_evidence_directory }}"
        - "{{ ai_ops_assistant_restricted_evidence_path }}"
      loop_control:
        label: protected-evidence-path
      register: ai_ops_assistant_restricted_evidence_path_stats
      changed_when: false
      no_log: true

    - name: Assert approved evidence parent and unused record path
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_parent_stat.stat.exists | bool
          - ai_ops_assistant_restricted_evidence_parent_stat.stat.isdir | bool
          - not (ai_ops_assistant_restricted_evidence_parent_stat.stat.islnk | default(false) | bool)
          - not (ai_ops_assistant_restricted_evidence_path_stats.results[0].stat.islnk | default(false) | bool)
          - not (ai_ops_assistant_restricted_evidence_path_stats.results[1].stat.exists | default(false) | bool)
        fail_msg: >-
          Protected evidence parent must already be an approved real directory and
          the requested run ID must not overwrite an existing record.
        quiet: true
      changed_when: false
      no_log: true

  tasks:
    - name: Create protected evidence directory
      ansible.builtin.file:
        path: "{{ ai_ops_assistant_restricted_evidence_directory }}"
        state: directory
        owner: "{{ ai_ops_assistant_restricted_evidence_file_owner }}"
        group: "{{ ai_ops_assistant_restricted_evidence_file_group }}"
        mode: "0700"
      register: ai_ops_assistant_restricted_evidence_directory_result
      no_log: true

    - name: Verify protected evidence directory metadata
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_directory }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_directory_stat
      changed_when: false
      no_log: true

    - name: Assert protected evidence directory metadata
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.isdir | bool
          - not (ai_ops_assistant_restricted_evidence_directory_stat.stat.islnk | default(false) | bool)
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.pw_name == ai_ops_assistant_restricted_evidence_file_owner
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.gr_name == ai_ops_assistant_restricted_evidence_file_group
          - ai_ops_assistant_restricted_evidence_directory_stat.stat.mode == '0700'
        fail_msg: >-
          Protected evidence directory metadata is not owner-, group-, or mode-safe.
        quiet: true
      changed_when: false
      no_log: true

    - name: Write normalized outcome-only evidence record
      ansible.builtin.copy:
        dest: "{{ ai_ops_assistant_restricted_evidence_path }}"
        owner: "{{ ai_ops_assistant_restricted_evidence_file_owner }}"
        group: "{{ ai_ops_assistant_restricted_evidence_file_group }}"
        mode: "0600"
        force: false
        content: |
          # Restricted Operator and Host Diagnostics Outcome-Only Evidence

          ## Metadata

          - Source revision: {{ ai_ops_assistant_restricted_evidence_source_revision }}
          - UTC timestamp: {{ ai_ops_assistant_restricted_evidence_timestamp_utc }}
          - Non-secret run ID: {{ ai_ops_assistant_restricted_evidence_run_id }}
          - Environment label: {{ ai_ops_assistant_restricted_evidence_environment_label }}
          - Host-group label: {{ ai_ops_assistant_restricted_evidence_host_group_label }}
          - Runtime label: {{ ai_ops_assistant_restricted_evidence_runtime_label }}
          - Evidence owner: {{ ai_ops_assistant_restricted_evidence_owner_name }}
          - Authorization class: {{ ai_ops_assistant_restricted_evidence_authorization_class }}
          - Authorization reference: {{ ai_ops_assistant_restricted_evidence_authorization_reference }}
          - Retention policy label: {{ ai_ops_assistant_restricted_evidence_retention_label }}
          - Access-role label: {{ ai_ops_assistant_restricted_evidence_access_role_label }}

          ## Normalized outcome

          - Overall status: {{ ai_ops_assistant_restricted_evidence_status }}
          - Limitation class: {{ ai_ops_assistant_restricted_evidence_limitation_class }}
          - Rollback status: {{ ai_ops_assistant_restricted_evidence_rollback_status }}
          - Unresolved gate labels: {{ (ai_ops_assistant_restricted_evidence_unresolved_gates | join(', ')) if (ai_ops_assistant_restricted_evidence_unresolved_gates | length > 0) else 'none' }}

          ## Bounded validation booleans

          - Phase 05 acceptance confirmed: {{ ai_ops_assistant_restricted_evidence_phase05_acceptance_confirmed | bool }}
          - Neutron read classified: {{ ai_ops_assistant_restricted_evidence_neutron_read_classified | bool }}
          - Operator-reader reviewed: {{ ai_ops_assistant_restricted_evidence_operator_reader_reviewed | bool }}
          - Observer policy reviewed: {{ ai_ops_assistant_restricted_evidence_observer_policy_reviewed | bool }}
          - Negative test plan approved: {{ ai_ops_assistant_restricted_evidence_negative_test_plan_approved | bool }}
          - Output schema frozen: {{ ai_ops_assistant_restricted_evidence_output_schema_frozen | bool }}
          - Redaction check completed: {{ ai_ops_assistant_restricted_evidence_redaction_check_completed | bool }}
      register: ai_ops_assistant_restricted_evidence_write_result
      no_log: true

    - name: Verify protected outcome-only evidence record metadata
      ansible.builtin.stat:
        path: "{{ ai_ops_assistant_restricted_evidence_path }}"
        follow: false
      register: ai_ops_assistant_restricted_evidence_record_stat
      changed_when: false
      no_log: true

    - name: Assert protected outcome-only evidence record metadata
      ansible.builtin.assert:
        that:
          - ai_ops_assistant_restricted_evidence_record_stat.stat.isreg | bool
          - not (ai_ops_assistant_restricted_evidence_record_stat.stat.islnk | default(false) | bool)
          - ai_ops_assistant_restricted_evidence_record_stat.stat.pw_name == ai_ops_assistant_restricted_evidence_file_owner
          - ai_ops_assistant_restricted_evidence_record_stat.stat.gr_name == ai_ops_assistant_restricted_evidence_file_group
          - ai_ops_assistant_restricted_evidence_record_stat.stat.mode == '0600'
        fail_msg: >-
          Protected evidence record metadata is not owner-, group-, or mode-safe.
        quiet: true
      changed_when: false
      no_log: true
