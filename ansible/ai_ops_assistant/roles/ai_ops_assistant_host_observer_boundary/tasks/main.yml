---
- name: Validate disabled-by-default host-observer policy contract
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_host_observer_boundary_enabled is boolean
      - ai_ops_assistant_host_observer_boundary_validation_mode is boolean
      - ai_ops_assistant_host_observer_boundary_account_name != 'aiops_assistant'
      - ai_ops_assistant_host_observer_boundary_account_group != 'aiops_assistant'
      - ai_ops_assistant_host_observer_boundary_account_shell == '/usr/sbin/nologin'
      - ai_ops_assistant_host_observer_boundary_key_label != 'aiops-assistant-project-reader'
      - ai_ops_assistant_host_observer_boundary_ssh_restrictions == ['no-agent-forwarding', 'no-X11-forwarding', 'no-port-forwarding', 'no-pty']
      - ai_ops_assistant_host_observer_boundary_collector_path == '/usr/local/libexec/openstack-ai-ops-assistant/host-observer-collector'
      - ai_ops_assistant_host_observer_boundary_collector_owner == 'root'
      - ai_ops_assistant_host_observer_boundary_collector_mode == '0750'
      - ai_ops_assistant_host_observer_boundary_collector_policy_path == '/etc/openstack-ai-ops-assistant/host-observer-policy.yml'
      - ai_ops_assistant_host_observer_boundary_collector_policy_owner == 'root'
      - ai_ops_assistant_host_observer_boundary_collector_policy_mode == '0600'
      - >-
        ai_ops_assistant_host_observer_boundary_collector_files | map(attribute='source') | list == [
        'host_observer/host_observer_collector.py'
        ]
      - >-
        ai_ops_assistant_host_observer_boundary_collector_files | map(attribute='destination') | list == [
        'host-observer-collector'
        ]
      - >-
        ai_ops_assistant_host_observer_boundary_collector_files | map(attribute='mode') | list == ['0750']
      - ai_ops_assistant_host_observer_boundary_sudoers_path == '/etc/sudoers.d/aiops-host-observer'
      - ai_ops_assistant_host_observer_boundary_sudoers_owner == 'root'
      - ai_ops_assistant_host_observer_boundary_sudoers_mode == '0440'
      - ai_ops_assistant_host_observer_boundary_allowed_inventory_roles is sequence
      - ai_ops_assistant_host_observer_boundary_allowed_host_labels is sequence
      - ai_ops_assistant_host_observer_boundary_per_host_enablement is mapping
    quiet: true
  changed_when: false
  no_log: true

- name: Reject unsafe or historical host-observer policy paths
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_host_observer_boundary_collector_path is match('^/usr/local/libexec/openstack-ai-ops-assistant/[^/]+$')
      - ai_ops_assistant_host_observer_boundary_collector_policy_path is match('^/etc/openstack-ai-ops-assistant/[^/]+$')
      - ai_ops_assistant_host_observer_boundary_sudoers_path is match('^/etc/sudoers.d/aiops-host-observer$')
      - "'..' not in ai_ops_assistant_host_observer_boundary_collector_path.split('/')"
      - "'..' not in ai_ops_assistant_host_observer_boundary_collector_policy_path.split('/')"
      - "'..' not in ai_ops_assistant_host_observer_boundary_sudoers_path.split('/')"
    quiet: true
  changed_when: false
  no_log: true

- name: Inspect host-observer collector source
  ansible.builtin.stat:
    path: "{{ role_path }}/files/scripts/{{ item.source }}"
    follow: false
  loop: "{{ ai_ops_assistant_host_observer_boundary_collector_files }}"
  loop_control:
    label: "{{ item.source }}"
  delegate_to: localhost
  become: false
  register: ai_ops_assistant_host_observer_boundary_collector_source_metadata
  changed_when: false

- name: Assert host-observer collector source is regular and non-symlinked
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    quiet: true
  loop: "{{ ai_ops_assistant_host_observer_boundary_collector_source_metadata.results }}"
  loop_control:
    label: "{{ item.item.source }}"
  changed_when: false

- name: Require approved observer policy before any provisioning task
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_host_observer_boundary_deployment_authorization == 'approved'
      - ai_ops_assistant_host_observer_boundary_inventory_projection_status == 'accepted'
      - ai_ops_assistant_host_observer_boundary_maintained_inventory_source | length > 0
      - ai_ops_assistant_host_observer_boundary_inventory_projection_revision | length > 0
      - ai_ops_assistant_host_observer_boundary_inventory_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_allowed_inventory_roles | length > 0
      - ai_ops_assistant_host_observer_boundary_inventory_role | length > 0
      - ai_ops_assistant_host_observer_boundary_inventory_role in ai_ops_assistant_host_observer_boundary_allowed_inventory_roles
      - ai_ops_assistant_host_observer_boundary_allowed_host_labels | length > 0
      - inventory_hostname in ai_ops_assistant_host_observer_boundary_allowed_host_labels
      - ai_ops_assistant_host_observer_boundary_per_host_enablement[inventory_hostname] | default(false) | bool
      - ai_ops_assistant_host_observer_boundary_account_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_account_removal_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_key_source | length > 0
      - ai_ops_assistant_host_observer_boundary_key_source_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_key_rotation_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_key_revocation_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_ssh_source_restriction | length > 0
      - ai_ops_assistant_host_observer_boundary_forced_command == ai_ops_assistant_host_observer_boundary_forced_command_path
      - ai_ops_assistant_host_observer_boundary_approved_source_classes | length > 0
      - ai_ops_assistant_host_observer_boundary_collector_source_allowlist | length > 0
      - ai_ops_assistant_host_observer_boundary_collector_time_bound_class | length > 0
      - ai_ops_assistant_host_observer_boundary_collector_line_bound_class | length > 0
      - ai_ops_assistant_host_observer_boundary_collector_byte_bound_class | length > 0
      - ai_ops_assistant_host_observer_boundary_redaction_policy_status == 'accepted'
      - ai_ops_assistant_host_observer_boundary_collector_metadata_status == 'accepted'
      - ai_ops_assistant_host_observer_boundary_collector_policy_metadata_status == 'accepted'
      - ai_ops_assistant_host_observer_boundary_sudo_policy_status in ['not_required', 'accepted']
      - >-
        not ai_ops_assistant_host_observer_boundary_sudo_required | bool or
        (ai_ops_assistant_host_observer_boundary_sudo_collector_argv | length > 0 and
        ai_ops_assistant_host_observer_boundary_sudo_collector_argv[0] ==
        ai_ops_assistant_host_observer_boundary_collector_path and
        ai_ops_assistant_host_observer_boundary_sudo_rule_reference | length > 0)
      - >-
        ai_ops_assistant_host_observer_boundary_sudo_required | bool or
        ai_ops_assistant_host_observer_boundary_sudo_collector_argv | length == 0
      - ai_ops_assistant_host_observer_boundary_rollback_owner | length > 0
      - ai_ops_assistant_host_observer_boundary_source_key_removal_owner | length > 0
    fail_msg: >-
      Host-observer provisioning is blocked until the maintained inventory
      projection, dedicated identity, forced collector, source bounds, redaction,
      sudo decision, and rollback owners are approved.
    quiet: true
  when: ai_ops_assistant_host_observer_boundary_enabled | bool
  changed_when: false
  no_log: true

- name: Ensure fixed host-observer collector directory is present
  ansible.builtin.file:
    path: /usr/local/libexec/openstack-ai-ops-assistant
    state: directory
    owner: root
    group: "{{ ai_ops_assistant_host_observer_boundary_collector_group }}"
    mode: "0750"
    recurse: false
  when: ai_ops_assistant_host_observer_boundary_enabled | bool

- name: Materialize exact host-observer collector
  ansible.builtin.copy:
    src: "scripts/{{ item.source }}"
    dest: "{{ ai_ops_assistant_host_observer_boundary_collector_path }}"
    owner: "{{ ai_ops_assistant_host_observer_boundary_collector_owner }}"
    group: "{{ ai_ops_assistant_host_observer_boundary_collector_group }}"
    mode: "{{ item.mode }}"
    backup: false
  loop: "{{ ai_ops_assistant_host_observer_boundary_collector_files }}"
  loop_control:
    label: "{{ item.destination }}"
  when: ai_ops_assistant_host_observer_boundary_enabled | bool

- name: Inspect materialized host-observer collector
  ansible.builtin.stat:
    path: "{{ ai_ops_assistant_host_observer_boundary_collector_path }}"
    follow: false
  register: ai_ops_assistant_host_observer_boundary_collector_destination_metadata
  changed_when: false
  when:
    - ai_ops_assistant_host_observer_boundary_enabled | bool
    - not ansible_check_mode

- name: Assert materialized host-observer collector metadata
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_host_observer_boundary_collector_destination_metadata.stat.exists
      - ai_ops_assistant_host_observer_boundary_collector_destination_metadata.stat.isreg
      - not ai_ops_assistant_host_observer_boundary_collector_destination_metadata.stat.islnk
      - ai_ops_assistant_host_observer_boundary_collector_destination_metadata.stat.pw_name == ai_ops_assistant_host_observer_boundary_collector_owner
      - ai_ops_assistant_host_observer_boundary_collector_destination_metadata.stat.gr_name == ai_ops_assistant_host_observer_boundary_collector_group
      - ai_ops_assistant_host_observer_boundary_collector_destination_metadata.stat.mode == '0750'
    quiet: true
  changed_when: false
  when:
    - ai_ops_assistant_host_observer_boundary_enabled | bool
    - not ansible_check_mode

- name: Keep host-observer provisioning unavailable by default
  ansible.builtin.assert:
    that:
      - not ai_ops_assistant_host_observer_boundary_enabled | bool or ai_ops_assistant_host_observer_boundary_deployment_authorization == 'approved'
    fail_msg: >-
      Host-observer provisioning remains unavailable until the maintained
      projection, forced-command policy, collector sources, optional sudo
      contract, and rollback owners are independently approved.
    quiet: true
  changed_when: false
