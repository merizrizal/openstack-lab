---
- name: Assert MCP wheelhouse builder target and contract
  ansible.builtin.assert:
    that:
      - "'builder01' in (groups['wheelhouse_builders'] | default([]))"
      - "(groups['wheelhouse_builders'] | default([])) | length == 1"
      - inventory_hostname == 'builder01'
      - builder01.environment == 'builder'
      - ai_ops_mcp_wheelhouse_build is mapping
      - >-
        ai_ops_mcp_wheelhouse_build.keys() | list | sort ==
        ['approval', 'dependency_lock_source', 'enabled',
        'environment_attestation_source', 'provenance_manifest_source',
        'publication', 'python_executable', 'seed', 'target']
      - ai_ops_mcp_wheelhouse_build.enabled | type_debug == 'bool'
      - ai_ops_mcp_wheelhouse_build.approval is mapping
      - >-
        ai_ops_mcp_wheelhouse_build.approval.keys() | list | sort ==
        ['expires_at_utc', 'id']
      - ai_ops_mcp_wheelhouse_build.dependency_lock_source == 'mcp/requirements.lock'
      - ai_ops_mcp_wheelhouse_build.provenance_manifest_source == 'mcp/manifest.json'
      - ai_ops_mcp_wheelhouse_build.publication is mapping
      - >-
        ai_ops_mcp_wheelhouse_build.publication.keys() | list | sort ==
        ['root', 'staging_root']
      - ai_ops_mcp_wheelhouse_build.publication.root == '/var/lib/openstack-ai-ops/wheelhouse-artifacts/mcp'
      - >-
        ai_ops_mcp_wheelhouse_build.publication.staging_root ==
        '/var/lib/openstack-ai-ops/wheelhouse-artifacts/mcp/.staging'
      - ai_ops_mcp_wheelhouse_build.seed is mapping
      - ai_ops_mcp_wheelhouse_build.seed.keys() | list | sort == ['inbox_root']
      - ai_ops_mcp_wheelhouse_build.seed.inbox_root == '/tmp/openstack-ai-ops-wheelhouse-seed-inbox/mcp'
      - ai_ops_mcp_wheelhouse_build.python_executable == '/usr/bin/python3'
      - ai_ops_mcp_wheelhouse_build.target is mapping
      - >-
        ai_ops_mcp_wheelhouse_build.target.keys() | list | sort ==
        ['abi', 'architecture', 'compatibility_tags', 'implementation',
        'platform', 'python_version']
      - ai_ops_mcp_wheelhouse_build.target.python_version == '3.12'
      - ai_ops_mcp_wheelhouse_build.target.abi == 'cp312'
      - ai_ops_mcp_wheelhouse_build.target.implementation == 'cp'
      - ai_ops_mcp_wheelhouse_build.target.architecture == 'x86_64'
      - ai_ops_mcp_wheelhouse_build.target.platform | type_debug == 'str'
      - ai_ops_mcp_wheelhouse_build.target.compatibility_tags | type_debug == 'list'
    fail_msg: ERR_MCP_WHEELHOUSE_BUILD_CONTRACT

- name: Assert enabled MCP wheelhouse build approval and target tags
  ansible.builtin.assert:
    that:
      - ai_ops_mcp_wheelhouse_build.approval.id is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$')
      - ai_ops_mcp_wheelhouse_build.environment_attestation_source | length > 0
      - >-
        ai_ops_mcp_wheelhouse_build.approval.expires_at_utc is match(
        '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
      - ai_ops_mcp_wheelhouse_build.target.platform | length > 0
      - ai_ops_mcp_wheelhouse_build.target.compatibility_tags | length > 0
      - >-
        ai_ops_mcp_wheelhouse_build.target.compatibility_tags |
        select('match', '^[A-Za-z0-9_.-]+$') | list | length ==
        ai_ops_mcp_wheelhouse_build.target.compatibility_tags | length
    fail_msg: ERR_MCP_WHEELHOUSE_BUILD_APPROVAL_OR_TAGS
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Inspect protected builder environment attestation
  ansible.builtin.stat:
    path: "{{ ai_ops_mcp_wheelhouse_build.environment_attestation_source }}"
    follow: false
  register: ai_ops_mcp_builder_attestation_stat
  changed_when: false
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Assert protected builder environment attestation boundary
  ansible.builtin.assert:
    that:
      - ai_ops_mcp_builder_attestation_stat.stat.exists
      - ai_ops_mcp_builder_attestation_stat.stat.isreg
      - not ai_ops_mcp_builder_attestation_stat.stat.islnk
      - ai_ops_mcp_builder_attestation_stat.stat.pw_name == 'root'
      - ai_ops_mcp_builder_attestation_stat.stat.mode == '0400'
    fail_msg: ERR_MCP_BUILDER_ATTESTATION_BOUNDARY
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Define approval-scoped MCP wheel seed inbox path
  ansible.builtin.set_fact:
    ai_ops_mcp_wheelhouse_seed_path: >-
      {{ ai_ops_mcp_wheelhouse_build.seed.inbox_root }}/{{ ai_ops_mcp_wheelhouse_build.approval.id }}/wheels
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Inspect approval-scoped MCP wheel seed inbox
  ansible.builtin.stat:
    path: "{{ ai_ops_mcp_wheelhouse_seed_path }}"
    follow: false
  register: ai_ops_mcp_wheelhouse_seed_stat
  changed_when: false
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Assert approval-scoped MCP wheel seed inbox boundary
  ansible.builtin.assert:
    that:
      - ai_ops_mcp_wheelhouse_seed_stat.stat.exists
      - ai_ops_mcp_wheelhouse_seed_stat.stat.isdir
      - not ai_ops_mcp_wheelhouse_seed_stat.stat.islnk
      - ai_ops_mcp_wheelhouse_seed_stat.stat.pw_name == ansible_user
      - ai_ops_mcp_wheelhouse_seed_stat.stat.mode == '0700'
    fail_msg: ERR_MCP_WHEELHOUSE_SEED_BOUNDARY
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Inspect owner-supplied MCP dependency inputs
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ item }}"
    follow: false
  loop:
    - "{{ ai_ops_mcp_wheelhouse_build.dependency_lock_source }}"
    - "{{ ai_ops_mcp_wheelhouse_build.provenance_manifest_source }}"
  delegate_to: localhost
  become: false
  register: ai_ops_mcp_wheelhouse_dependency_inputs
  changed_when: false
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Assert owner-supplied MCP dependency inputs are regular files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: ERR_MCP_WHEELHOUSE_DEPENDENCY_INPUTS
  loop: "{{ ai_ops_mcp_wheelhouse_dependency_inputs.results }}"
  loop_control:
    label: dependency-input
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Discover supplied MCP wheel seed files
  ansible.builtin.find:
    paths: "{{ ai_ops_mcp_wheelhouse_seed_path }}"
    patterns: "*.whl"
    file_type: file
    recurse: false
  register: ai_ops_mcp_wheelhouse_seed_wheels
  changed_when: false
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Discover supplied MCP wheel seed symlinks
  ansible.builtin.find:
    paths: "{{ ai_ops_mcp_wheelhouse_seed_path }}"
    patterns: "*.whl"
    file_type: link
    recurse: false
  register: ai_ops_mcp_wheelhouse_seed_links
  changed_when: false
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Assert supplied MCP wheel seed contents
  ansible.builtin.assert:
    that:
      - ai_ops_mcp_wheelhouse_seed_wheels.matched | int > 0
      - ai_ops_mcp_wheelhouse_seed_links.matched | int == 0
    fail_msg: ERR_MCP_WHEELHOUSE_SEED_CONTENTS
  when: ai_ops_mcp_wheelhouse_build.enabled

- name: Verify and publish approved offline MCP wheelhouse
  ansible.builtin.include_tasks: publish.yml
  when: ai_ops_mcp_wheelhouse_build.enabled
