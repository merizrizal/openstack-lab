---
ai_ops_assistant_foundation_enabled: true
ai_ops_assistant_foundation_validation_mode: true

ai_ops_assistant_foundation_runtime_root: /opt/openstack-ai-ops-assistant
ai_ops_assistant_foundation_runtime_user: aiops_assistant
ai_ops_assistant_foundation_runtime_group: aiops_assistant
ai_ops_assistant_foundation_profile_name: aiops-assistant-project-reader
ai_ops_assistant_foundation_audit_root: /opt/openstack-ai-ops-assistant/audit

ai_ops_assistant_foundation_workspaces:
  - path: /opt/openstack-ai-ops-assistant
    owner: root
    group: aiops_assistant
    mode: "0750"
  - path: /opt/openstack-ai-ops-assistant/scripts/approved
    owner: root
    group: aiops_assistant
    mode: "0750"
  - path: /opt/openstack-ai-ops-assistant/output
    owner: aiops_assistant
    group: aiops_assistant
    mode: "0750"
  - path: /opt/openstack-ai-ops-assistant/credentials
    owner: aiops_assistant
    group: aiops_assistant
    mode: "0700"
  - path: /opt/openstack-ai-ops-assistant/audit
    owner: aiops_assistant
    group: aiops_assistant
    mode: "0700"
  - path: /opt/openstack-ai-ops-assistant/tests
    owner: root
    group: aiops_assistant
    mode: "0750"
  - path: /opt/openstack-ai-ops-assistant/mcp
    owner: aiops_assistant
    group: aiops_assistant
    mode: "0700"
  - path: /opt/openstack-ai-ops-assistant/evidence/foundation
    owner: root
    group: aiops_assistant
    mode: "0750"

ai_ops_assistant_foundation_packages:
  - name: python3
    capability: Python
  - name: python3-venv
    capability: Python
  - name: python3-openstackclient
    capability: OpenStack CLI
  - name: python3-openstacksdk
    capability: OpenStack SDK
  - name: openssh-client
    capability: SSH client
  - name: curl
    capability: HTTP/TCP tooling
  - name: jq
    capability: JSON tooling
  - name: ripgrep
    capability: Log-search tooling
  - name: git
    capability: Version-control tooling
