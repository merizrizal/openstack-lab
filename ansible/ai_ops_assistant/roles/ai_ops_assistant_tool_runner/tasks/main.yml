---
- name: Validate revised tool-runner deployment contract
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_tool_runner_enabled is boolean
      - >-
        not (ai_ops_assistant_tool_runner_enabled | bool) or
        (ai_ops_assistant_tool_runner_explicit_deployment | default(false) | bool)
      - ai_ops_assistant_tool_runner_runtime_root == '/opt/openstack-ai-ops-assistant'
      - ai_ops_assistant_tool_runner_runtime_user == 'aiops_assistant'
      - ai_ops_assistant_tool_runner_runtime_group == 'aiops_assistant'
      - >-
        ai_ops_assistant_tool_runner_directory ==
        ai_ops_assistant_tool_runner_runtime_root + '/scripts/tool_runner'
      - >-
        ai_ops_assistant_tool_runner_path ==
        ai_ops_assistant_tool_runner_directory + '/aiops_tool_runner.py'
      - >-
        ai_ops_assistant_tool_runner_registry_path ==
        ai_ops_assistant_tool_runner_directory + '/tool_registry.json'
      - >-
        ai_ops_assistant_tool_runner_approved_script_root ==
        ai_ops_assistant_tool_runner_runtime_root + '/scripts/approved'
      - ai_ops_assistant_tool_runner_credential_profile == 'aiops-assistant-project-reader'
      - >-
        ai_ops_assistant_tool_runner_host_observer_projection_directory ==
        ai_ops_assistant_tool_runner_runtime_root + '/credentials/host-observer'
      - >-
        ai_ops_assistant_tool_runner_host_observer_projection_path ==
        ai_ops_assistant_tool_runner_host_observer_projection_directory + '/destination-projection.json'
      - ai_ops_assistant_tool_runner_host_observer_projection_owner == 'aiops_assistant'
      - ai_ops_assistant_tool_runner_host_observer_projection_group == 'aiops_assistant'
      - ai_ops_assistant_tool_runner_host_observer_projection_directory_mode == '0700'
      - ai_ops_assistant_tool_runner_host_observer_projection_mode == '0600'
      - >-
        ai_ops_assistant_tool_runner_audit_directory ==
        ai_ops_assistant_tool_runner_runtime_root + '/audit'
      - >-
        ai_ops_assistant_tool_runner_audit_active_file ==
        ai_ops_assistant_tool_runner_audit_directory + '/tool-runner.jsonl'
      - >-
        ai_ops_assistant_tool_runner_audit_lock_file ==
        ai_ops_assistant_tool_runner_audit_directory + '/.tool-runner.lock'
      - >-
        ai_ops_assistant_tool_runner_audit_archive_files == [
        ai_ops_assistant_tool_runner_audit_directory + '/tool-runner.jsonl.1',
        ai_ops_assistant_tool_runner_audit_directory + '/tool-runner.jsonl.2',
        ai_ops_assistant_tool_runner_audit_directory + '/tool-runner.jsonl.3'
        ]
      - ai_ops_assistant_tool_runner_audit_owner == 'aiops_assistant'
      - ai_ops_assistant_tool_runner_audit_group == 'aiops_assistant'
      - ai_ops_assistant_tool_runner_audit_directory_mode == '0700'
      - ai_ops_assistant_tool_runner_audit_file_mode == '0600'
      - ai_ops_assistant_tool_runner_audit_event_max_bytes == 16384
      - ai_ops_assistant_tool_runner_audit_rotation_bytes == 1048576
      - ai_ops_assistant_tool_runner_audit_archive_count == 3
      - >-
        ai_ops_assistant_tool_runner_targets == [ ai_ops_assistant_tool_runner_approved_script_root + '/project_resource_summary.sh',
        ai_ops_assistant_tool_runner_approved_script_root + '/server_basic_info.sh', ai_ops_assistant_tool_runner_approved_script_root +
        '/server_network_info.sh', ai_ops_assistant_tool_runner_approved_script_root + '/neutron_agent_health.py' ]
      - >-
        ai_ops_assistant_tool_runner_files | map(attribute='source') | list == [
        'aiops_tool_runner.py', 'audit_inspector.py', 'host_observer_connector.py',
        'tool_registry.json'
        ]
      - >-
        ai_ops_assistant_tool_runner_files | map(attribute='mode') | list == [
        '0750', '0750', '0750', '0640'
        ]
      - "'..' not in ai_ops_assistant_tool_runner_directory.split('/')"
    quiet: true

- name: Inspect tool-runner source files
  ansible.builtin.stat:
    path: "{{ role_path }}/files/scripts/tool_runner/{{ item.source }}"
    follow: false
  loop: "{{ ai_ops_assistant_tool_runner_files }}"
  loop_control:
    label: "{{ item.source }}"
  delegate_to: localhost
  become: false
  register: ai_ops_assistant_tool_runner_source_metadata
  changed_when: false

- name: Assert tool-runner source files are regular and non-symlinked
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
    quiet: true
  loop: "{{ ai_ops_assistant_tool_runner_source_metadata.results }}"
  loop_control:
    label: "{{ item.item.source }}"
  changed_when: false

- name: Ensure revised tool-runner directory is present
  ansible.builtin.file:
    path: "{{ ai_ops_assistant_tool_runner_directory }}"
    state: directory
    owner: root
    group: "{{ ai_ops_assistant_tool_runner_runtime_group }}"
    mode: "0750"
    recurse: false
  when: ai_ops_assistant_tool_runner_enabled | bool

- name: Materialize exact revised tool-runner files
  ansible.builtin.copy:
    src: "scripts/tool_runner/{{ item.source }}"
    dest: "{{ ai_ops_assistant_tool_runner_directory }}/{{ item.source }}"
    owner: root
    group: "{{ ai_ops_assistant_tool_runner_runtime_group }}"
    mode: "{{ item.mode }}"
    backup: false
  loop: "{{ ai_ops_assistant_tool_runner_files }}"
  loop_control:
    label: "{{ item.source }}"
  when: ai_ops_assistant_tool_runner_enabled | bool

- name: Inspect materialized tool-runner files
  ansible.builtin.stat:
    path: "{{ ai_ops_assistant_tool_runner_directory }}/{{ item.source }}"
    follow: false
  loop: "{{ ai_ops_assistant_tool_runner_files }}"
  loop_control:
    label: "{{ item.source }}"
  register: ai_ops_assistant_tool_runner_destination_metadata
  changed_when: false
  when:
    - ai_ops_assistant_tool_runner_enabled | bool
    - not ansible_check_mode

- name: Assert materialized tool-runner file metadata
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == ai_ops_assistant_tool_runner_runtime_group
      - item.stat.mode == item.item.mode
    quiet: true
  loop: "{{ ai_ops_assistant_tool_runner_destination_metadata.results }}"
  loop_control:
    label: "{{ item.item.source }}"
  changed_when: false
  when:
    - ai_ops_assistant_tool_runner_enabled | bool
    - not ansible_check_mode
