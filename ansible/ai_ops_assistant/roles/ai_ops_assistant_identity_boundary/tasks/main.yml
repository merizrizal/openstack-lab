---
- name: Validate revised identity-boundary materialization contract
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_identity_boundary_enabled is boolean
      - >-
        ai_ops_assistant_identity_boundary_runtime_root ==
        '/opt/openstack-ai-ops-assistant'
      - ai_ops_assistant_identity_boundary_runtime_user == 'aiops_assistant'
      - ai_ops_assistant_identity_boundary_runtime_group == 'aiops_assistant'
      - >-
        ai_ops_assistant_identity_boundary_profile_name ==
        'aiops-assistant-project-reader'
      - >-
        ai_ops_assistant_identity_boundary_profile_directory ==
        ai_ops_assistant_identity_boundary_runtime_root + '/credentials/profiles'
      - ai_ops_assistant_identity_boundary_profile_directory_mode == '0700'
      - ai_ops_assistant_identity_boundary_profile_file_mode == '0600'
      - >-
        ai_ops_assistant_identity_boundary_expected_filenames ==
        ['clouds.yaml', 'secure.yaml']
      - >-
        ai_ops_assistant_identity_boundary_source_classification ==
        'controller-local'
      - >-
        ai_ops_assistant_identity_boundary_source_root ==
        '/run/openstack-ai-ops'
      - ai_ops_assistant_identity_boundary_source_directory is string
      - ai_ops_assistant_identity_boundary_source_directory_owner is string
      - ai_ops_assistant_identity_boundary_source_file_owner is string
      - >-
        not ai_ops_assistant_identity_boundary_enabled | bool or
        ai_ops_assistant_identity_boundary_source_directory | length > 0
      - >-
        not ai_ops_assistant_identity_boundary_enabled | bool or
        ai_ops_assistant_identity_boundary_source_directory_owner | length > 0
      - >-
        not ai_ops_assistant_identity_boundary_enabled | bool or
        ai_ops_assistant_identity_boundary_source_file_owner | length > 0
      - >-
        ai_ops_assistant_identity_boundary_source_directory | length == 0 or
        ai_ops_assistant_identity_boundary_source_directory.startswith(
        ai_ops_assistant_identity_boundary_source_root + '/')
      - >-
        ai_ops_assistant_identity_boundary_source_directory | length == 0 or
        ai_ops_assistant_identity_boundary_source_directory !=
        ai_ops_assistant_identity_boundary_source_root
      - >-
        '..' not in ai_ops_assistant_identity_boundary_source_directory.split('/')
      - ai_ops_assistant_identity_boundary_source_directory_mode == '0700'
      - ai_ops_assistant_identity_boundary_source_file_mode == '0600'
    quiet: true
  no_log: true

- name: Inspect protected controller-local source directory metadata
  ansible.builtin.stat:
    path: "{{ ai_ops_assistant_identity_boundary_source_directory }}"
    follow: false
  delegate_to: localhost
  become: false
  register: ai_ops_assistant_identity_boundary_source_directory_metadata
  changed_when: false
  no_log: true
  when: ai_ops_assistant_identity_boundary_enabled | bool

- name: Assert protected controller-local source directory metadata
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_identity_boundary_source_directory_metadata.stat.exists
      - ai_ops_assistant_identity_boundary_source_directory_metadata.stat.isdir
      - not ai_ops_assistant_identity_boundary_source_directory_metadata.stat.islnk
      - >-
        ai_ops_assistant_identity_boundary_source_directory_metadata.stat.pw_name ==
        ai_ops_assistant_identity_boundary_source_directory_owner
      - >-
        ai_ops_assistant_identity_boundary_source_directory_metadata.stat.mode ==
        ai_ops_assistant_identity_boundary_source_directory_mode
    quiet: true
  changed_when: false
  no_log: true
  when: ai_ops_assistant_identity_boundary_enabled | bool

- name: Inspect protected controller-local source file metadata
  ansible.builtin.stat:
    path: >-
      {{ ai_ops_assistant_identity_boundary_source_directory }}/{{ item }}
    follow: false
  loop: "{{ ai_ops_assistant_identity_boundary_expected_filenames }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  register: ai_ops_assistant_identity_boundary_source_file_metadata
  changed_when: false
  no_log: true
  when: ai_ops_assistant_identity_boundary_enabled | bool

- name: Assert protected controller-local source file metadata
  ansible.builtin.assert:
    that:
      - item.item in ai_ops_assistant_identity_boundary_expected_filenames
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - >-
        item.stat.pw_name == ai_ops_assistant_identity_boundary_source_file_owner
      - >-
        item.stat.mode ==
        ai_ops_assistant_identity_boundary_source_file_mode
    quiet: true
  loop: "{{ ai_ops_assistant_identity_boundary_source_file_metadata.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  no_log: true
  when: ai_ops_assistant_identity_boundary_enabled | bool

- name: Ensure protected runtime profile directory is present
  ansible.builtin.file:
    path: "{{ ai_ops_assistant_identity_boundary_profile_directory }}"
    state: directory
    owner: "{{ ai_ops_assistant_identity_boundary_runtime_user }}"
    group: "{{ ai_ops_assistant_identity_boundary_runtime_group }}"
    mode: "{{ ai_ops_assistant_identity_boundary_profile_directory_mode }}"
    recurse: false
  no_log: true
  when: ai_ops_assistant_identity_boundary_enabled | bool

- name: Inspect protected runtime profile directory metadata
  ansible.builtin.stat:
    path: "{{ ai_ops_assistant_identity_boundary_profile_directory }}"
    follow: false
  register: ai_ops_assistant_identity_boundary_profile_directory_metadata
  changed_when: false
  no_log: true
  when:
    - ai_ops_assistant_identity_boundary_enabled | bool
    - not ansible_check_mode

- name: Assert protected runtime profile directory metadata
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_identity_boundary_profile_directory_metadata.stat.exists
      - ai_ops_assistant_identity_boundary_profile_directory_metadata.stat.isdir
      - not ai_ops_assistant_identity_boundary_profile_directory_metadata.stat.islnk
      - >-
        ai_ops_assistant_identity_boundary_profile_directory_metadata.stat.pw_name ==
        ai_ops_assistant_identity_boundary_runtime_user
      - >-
        ai_ops_assistant_identity_boundary_profile_directory_metadata.stat.gr_name ==
        ai_ops_assistant_identity_boundary_runtime_group
      - >-
        ai_ops_assistant_identity_boundary_profile_directory_metadata.stat.mode ==
        ai_ops_assistant_identity_boundary_profile_directory_mode
    quiet: true
  changed_when: false
  no_log: true
  when:
    - ai_ops_assistant_identity_boundary_enabled | bool
    - not ansible_check_mode

- name: Materialize protected runtime profile files
  ansible.builtin.copy:
    src: >-
      {{ ai_ops_assistant_identity_boundary_source_directory }}/{{ item }}
    dest: "{{ ai_ops_assistant_identity_boundary_profile_directory }}/{{ item }}"
    owner: "{{ ai_ops_assistant_identity_boundary_runtime_user }}"
    group: "{{ ai_ops_assistant_identity_boundary_runtime_group }}"
    mode: "{{ ai_ops_assistant_identity_boundary_profile_file_mode }}"
    backup: false
  loop: "{{ ai_ops_assistant_identity_boundary_expected_filenames }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
  when: ai_ops_assistant_identity_boundary_enabled | bool

- name: Inspect protected runtime profile file metadata
  ansible.builtin.stat:
    path: "{{ ai_ops_assistant_identity_boundary_profile_directory }}/{{ item }}"
    follow: false
  loop: "{{ ai_ops_assistant_identity_boundary_expected_filenames }}"
  loop_control:
    label: "{{ item }}"
  register: ai_ops_assistant_identity_boundary_profile_file_metadata
  changed_when: false
  no_log: true
  when:
    - ai_ops_assistant_identity_boundary_enabled | bool
    - not ansible_check_mode

- name: Assert protected runtime profile file metadata
  ansible.builtin.assert:
    that:
      - item.item in ai_ops_assistant_identity_boundary_expected_filenames
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - >-
        item.stat.pw_name == ai_ops_assistant_identity_boundary_runtime_user
      - >-
        item.stat.gr_name == ai_ops_assistant_identity_boundary_runtime_group
      - >-
        item.stat.mode ==
        ai_ops_assistant_identity_boundary_profile_file_mode
    quiet: true
  loop: "{{ ai_ops_assistant_identity_boundary_profile_file_metadata.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  no_log: true
  when:
    - ai_ops_assistant_identity_boundary_enabled | bool
    - not ansible_check_mode
