---
- name: Validate disabled-by-default operator-reader boundary contract
  ansible.builtin.assert:
    that:
      - ai_ops_assistant_operator_identity_boundary_enabled is boolean
      - >-
        ai_ops_assistant_operator_identity_boundary_runtime_root ==
        '/opt/openstack-ai-ops-assistant'
      - >-
        ai_ops_assistant_operator_identity_boundary_runtime_user ==
        'aiops_assistant'
      - >-
        ai_ops_assistant_operator_identity_boundary_runtime_group ==
        'aiops_assistant'
      - >-
        ai_ops_assistant_operator_identity_boundary_profile_name ==
        'aiops-assistant-operator-reader'
      - >-
        ai_ops_assistant_operator_identity_boundary_profile_name !=
        'aiops-assistant-project-reader'
      - >-
        ai_ops_assistant_operator_identity_boundary_profile_directory ==
        '/opt/openstack-ai-ops-assistant/credentials/operator-reader'
      - >-
        ai_ops_assistant_operator_identity_boundary_profile_directory !=
        '/opt/openstack-ai-ops-assistant/credentials/profiles'
      - >-
        ai_ops_assistant_operator_identity_boundary_profile_directory_mode ==
        '0700'
      - >-
        ai_ops_assistant_operator_identity_boundary_profile_file_mode ==
        '0600'
      - >-
        ai_ops_assistant_operator_identity_boundary_expected_filenames ==
        ['clouds.yaml', 'secure.yaml']
      - >-
        ai_ops_assistant_operator_identity_boundary_source_classification ==
        'controller-local'
      - >-
        ai_ops_assistant_operator_identity_boundary_source_root ==
        '/run/openstack-ai-ops'
      - ai_ops_assistant_operator_identity_boundary_source_directory is string
      - >-
        ai_ops_assistant_operator_identity_boundary_source_directory_owner is
        string
      - >-
        ai_ops_assistant_operator_identity_boundary_source_file_owner is string
      - >-
        ai_ops_assistant_operator_identity_boundary_source_directory_mode ==
        '0700'
      - >-
        ai_ops_assistant_operator_identity_boundary_source_file_mode ==
        '0600'
      - >-
        ai_ops_assistant_operator_identity_boundary_selection_tool ==
        'neutron_agent_health'
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_source_directory | length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_source_directory_owner |
        length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_source_file_owner | length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_identity_owner | length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_approved_role_scope |
        length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_expiry_policy | length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_rotation_owner | length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_revocation_owner | length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_mutation_denial_reference |
        length > 0
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_source_directory.startswith(
        ai_ops_assistant_operator_identity_boundary_source_root + '/')
      - >-
        not ai_ops_assistant_operator_identity_boundary_enabled | bool or
        ai_ops_assistant_operator_identity_boundary_source_directory !=
        ai_ops_assistant_operator_identity_boundary_source_root
      - >-
        '..' not in
        ai_ops_assistant_operator_identity_boundary_source_directory.split('/')
    quiet: true
  no_log: true

- name: Keep operator-reader profile materialization unavailable
  ansible.builtin.fail:
    msg: >-
      Operator-reader profile materialization is intentionally unavailable in
      this contract-only chunk; no credential or profile content may be created.
  when: ai_ops_assistant_operator_identity_boundary_enabled | bool
  no_log: true
